<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151e25">
<link rel="icon" href="logo.png">
<title>VandB Quizz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(!window.Peer)document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>if(!window.Peer)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"><\/script>')</script>
<script src="config.js"></script>
<script>if(new URLSearchParams(location.search).has("mock"))document.write('<script src="mock-reseau.js"><\/script>')</script>
<script src="qrcode.min.js"></script>
<style>
:root{
  --bg:#151e25; --bg2:#22303b; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --text:#fff7ef; --muted:#d9bfc6; --gold:#f7a325; --wine:#e8551f;
  --c0:#e2463f; --c1:#2f7de1; --c2:#e8a317; --c3:#2ea862;
  --ok:#2ea862; --ko:#e2463f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--bg)}
body{background:radial-gradient(120% 90% at 20% 0%,var(--bg2),var(--bg) 60%) fixed;color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,.display{font-family:"Bricolage Grotesque",Inter,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select{font:inherit}
.btn{background:var(--gold);color:#151e25;font-weight:700;padding:14px 22px;border-radius:14px;font-size:1.05rem;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
#app{min-height:100%}

/* ---------- HOME ---------- */
.home{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.home-card{width:100%;max-width:520px;min-width:0;text-align:center}
.home h1{font-size:clamp(2.6rem,9vw,4.4rem);line-height:.95;margin:10px 0 14px}
.home h1 em{font-style:normal;color:var(--gold)}
.home p{color:var(--muted);margin-bottom:28px}
.home .stack{display:grid;gap:12px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;width:0;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700;font-size:1.2rem}
.sep{color:var(--muted);font-size:.85rem;margin:6px 0}
.kicker{text-transform:uppercase;letter-spacing:.25em;font-size:.78rem;color:var(--gold);font-weight:700}

/* ---------- TV ---------- */
.tv{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:3vh 4vw;gap:2.4vh;font-size:clamp(12px,min(1.55vw,2.75vh),48px)}
.tv-head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.tv-head h1{font-size:2.6em;line-height:1}
.tools{display:flex;gap:10px;align-items:center}
.tools button{font-size:.75em;padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.tools button.on{background:var(--gold);color:#151e25;border-color:transparent}
.lobby-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:3vw;min-height:0}
.joincard{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:3vh 2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.joincard .qr{background:#fff;padding:14px;border-radius:18px;line-height:0}
.joincard .qr img,.joincard .qr canvas{width:min(32vh,24vw)!important;height:auto!important}
.joincard{overflow:hidden;min-height:0}
.joincard .warn{font-size:.65em}
.joincard .code{font-size:1.1em;color:var(--muted)}
.joincard .code b{display:block;font-family:"Bricolage Grotesque";font-size:3.2em;color:var(--gold);letter-spacing:.15em;line-height:1.05}
.joincard .url{font-size:.7em;color:var(--muted);word-break:break-all}
.players{display:flex;flex-direction:column;min-height:0}
.players h2{font-size:1.6em;margin-bottom:1.5vh}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow:auto}
.chip{background:var(--card);border:1px solid var(--line);padding:.45em .9em;border-radius:999px;font-weight:600;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.chip.off{opacity:.4}
.chip:hover{border-color:var(--ko)}
.empty{color:var(--muted)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.settings{display:flex;flex-wrap:wrap;gap:1.2vw;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.6vh 1.6vw;font-size:.8em}
.settings label{display:flex;align-items:center;gap:8px;color:var(--muted)}
.settings select,.settings input[type=text]{background:#1b252d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.cat{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.95em}
.cat.on{background:var(--wine);color:#fff;border-color:transparent}
.settings .btn{margin-left:auto;font-size:1.2em;padding:.6em 1.4em}

.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--muted)}
.pill{background:var(--wine);color:#fff;padding:.3em .9em;border-radius:999px}
.answered b{color:var(--gold);font-size:1.4em}
.qtext{font-size:2.6em;line-height:1.12;text-align:center;flex:1;display:grid;place-items:center;padding:0 3vw;text-wrap:balance}
.timer{display:flex;align-items:center;gap:1.2vw}
.track{flex:1;height:14px;background:var(--card);border-radius:99px;overflow:hidden}
.bar{height:100%;background:var(--gold);border-radius:99px;width:100%;transform-origin:left}
.secs{font-family:"Bricolage Grotesque";font-weight:800;font-size:2.2em;min-width:2.2ch;text-align:right}
.secs.hot{color:var(--ko)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.4vw}
.ch{position:relative;overflow:hidden;display:flex;align-items:center;gap:1vw;padding:2.4vh 1.6vw;border-radius:20px;font-weight:700;font-size:1.45em;min-height:12vh;transition:opacity .4s,transform .4s}
.ch .shape{font-size:1.1em;opacity:.9;flex:none}
.ch .lbl{position:relative;z-index:1;flex:1}
.ch .cnt{position:relative;z-index:1;font-family:"Bricolage Grotesque";font-size:1.2em}
.ch .fill{position:absolute;inset:0;background:rgba(0,0,0,.18);transform-origin:left;transition:transform .8s}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.reveal .ch.wrong{opacity:.28;transform:scale(.97)}
.reveal .ch.right{box-shadow:0 0 0 6px #fff,0 0 50px rgba(255,255,255,.35);transform:scale(1.02)}
.reveal .ch.right::after{content:"✓";position:relative;z-index:1;font-size:1.4em}
.hint{text-align:center;color:var(--muted);font-size:.75em}
.next{align-self:center;font-size:1.1em}

.lb{flex:1;display:flex;flex-direction:column;gap:1.1vh;max-width:1100px;width:100%;margin:0 auto}
.lb h2{font-size:2.4em;text-align:center;margin-bottom:1vh}
.row{display:flex;align-items:center;gap:1.4vw;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2vh 1.6vw;font-size:1.3em;animation:slide .45s both}
.row .rk{font-family:"Bricolage Grotesque";font-weight:800;width:2ch;color:var(--gold)}
.row .nm{flex:1;font-weight:700}
.row .gain{color:var(--ok);font-weight:700;font-size:.8em}
.row .sc{font-family:"Bricolage Grotesque";font-weight:800}
@keyframes slide{from{opacity:0;transform:translateY(16px)}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:2vw;flex:1;padding-bottom:2vh}
.step{display:flex;flex-direction:column;align-items:center;gap:1vh;width:18vw}
.step .who{font-weight:800;font-size:1.4em;text-align:center}
.step .pts{color:var(--muted)}
.step .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:2vh;font-family:"Bricolage Grotesque";font-weight:800;font-size:3em;color:#151e25;animation:rise .9s cubic-bezier(.2,1.2,.4,1) both}
.p1 .blk{height:34vh;background:var(--gold);animation-delay:.9s}
.p2 .blk{height:24vh;background:#d8d8e0;animation-delay:.45s}
.p3 .blk{height:17vh;background:#d58a4e}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}}

/* ---------- PHONE ---------- */
.ph{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.ph-top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--muted);font-size:.9rem;gap:8px}
.ph-top .me{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;color:var(--text);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 0}
.ph-center h2{font-size:2rem;line-height:1.1}
.ph-center p{color:var(--muted)}
.big-emoji{font-size:4.5rem;line-height:1}
.ph form{display:grid;gap:12px;width:100%}
.ph input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:16px;font-size:1.2rem;text-align:center}
.pq{font-weight:700;font-size:1.05rem;margin:12px 0;text-align:center;line-height:1.3}
.pchoices{flex:1;display:grid;grid-template-rows:repeat(4,1fr);gap:10px}
.pch{border-radius:18px;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;color:#fff;min-height:64px}
.pch .shape{font-size:1.5rem}
.ptime{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.3rem;color:var(--text)}
.result{width:100%;border-radius:24px;padding:28px 18px}
.result.ok{background:var(--ok)}.result.ko{background:var(--ko)}.result.none{background:var(--card);border:1px solid var(--line)}
.result h2{font-size:2.2rem}
.result .gain{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.6rem;margin-top:6px}
.result .corr{margin-top:10px;opacity:.95}
.stat{display:flex;gap:10px;width:100%}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:"Bricolage Grotesque";font-size:1.7rem}
.stat span{color:var(--muted);font-size:.8rem}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:9}
.logo{display:block;max-width:100%;height:auto;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
.home .logo{width:min(460px,100%);margin:0 auto 6px}
.tv-head .logo{height:11vh;width:auto}
.ph .logo{width:min(300px,80%);margin:0 auto}
.warn{background:#5a1a10;border:1px solid #e2463f;border-radius:12px;padding:10px 14px;font-size:.75em;color:#ffd9cf}

.net{font-size:.7em;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.net.ok::before{content:"● ";color:var(--ok)}.net.bad::before{content:"● ";color:var(--ko)}
.banner{position:fixed;top:0;left:0;right:0;background:var(--ko);color:#fff;text-align:center;padding:8px;font-weight:700;z-index:20}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:30;padding:16px}
.modal-box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(900px,100%);max-height:92vh;display:flex;flex-direction:column;gap:12px;font-size:15px}
.modal-box h3{font-size:1.4rem}
.modal-box p,.modal-box li{color:var(--muted);font-size:.9rem}
.modal-box code{background:#0006;padding:2px 6px;border-radius:6px;color:var(--text)}
.modal-box textarea{flex:1;min-height:260px;background:#0b1116;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,monospace;resize:vertical}
.modal-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ed{max-width:760px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.ed-top{display:flex;justify-content:space-between;align-items:center}
.ed h2{font-size:1.7rem}
.logo.mini{width:110px}
.btn.sm{padding:8px 14px;font-size:.9rem;text-decoration:none}
.muted{color:var(--muted);font-size:.92rem}
.ed-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ed-actions.sticky{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.ed-list{display:flex;flex-direction:column;gap:10px}
.ed-item{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.ed-item small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.ed-title{width:100%;background:transparent;border:0;border-bottom:2px dashed var(--line);color:var(--text);font:inherit;padding:4px 0}
.ed-q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ed-qh{display:flex;justify-content:space-between;align-items:center}
.pill.sm{font-size:.78rem;padding:3px 10px}
.ed-qt{font-weight:700}
.ed-ans{display:flex;flex-wrap:wrap;gap:6px}
.ed-ans span{font-size:.85rem;padding:4px 10px;border-radius:99px;background:#0003;color:var(--muted)}
.ed-ans span.good{background:var(--ok);color:#fff;font-weight:700}
.ed-qa{display:flex;gap:6px;flex-wrap:wrap}
.ed-qa button{padding:6px 12px;border-radius:10px;background:#0003;border:1px solid var(--line);font-size:.85rem}
.ed-qa button:disabled{opacity:.3}
.danger{color:#ff8a80!important}
.ed-form{display:flex;flex-direction:column;gap:12px}
.ed-form>label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.ed-form input,.ed-form textarea{background:#0b1116;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:1rem}
.ed-a{display:flex;align-items:center;gap:10px;border-radius:14px;padding:8px 10px}
.ed-a input:not([type=radio]){flex:1;min-width:0;border:0}
.ed-a .ok{display:flex;align-items:center;gap:4px;font-size:.85rem;font-weight:700;color:#fff;white-space:nowrap}
.ed-a .ok input{width:20px;height:20px;accent-color:#fff}
.tg{display:flex;gap:8px;align-items:center;color:var(--muted)}
@media (pointer:coarse){ .tools button,.cat{padding:10px 16px} .settings select,.settings input[type=text]{padding:10px 12px} .settings input[type=checkbox]{width:22px;height:22px} }
@media (max-aspect-ratio:1/1){ .lobby-grid{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)} .joincard .qr img,.joincard .qr canvas{width:min(26vh,50vw)!important} .tv{font-size:clamp(12px,min(2.4vw,2vh),40px)} .step{width:28vw} }
.is-fs #fs{display:none}
body.idle,body.idle *{cursor:none!important}
.av{display:inline-grid;place-items:center;flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--pc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);line-height:1}
.av.sm{width:1.6em;height:1.6em;font-size:.95em}
.av.big{width:2.2em;height:2.2em;font-size:2.2rem}
.av.huge{width:2em;height:2em;font-size:3.6rem}
.chip{display:inline-flex;align-items:center;gap:.45em;border-color:var(--pc,var(--line));padding-left:.35em}
.row{border-left:6px solid var(--pc,var(--line))}
.row .av{font-size:.9em}
.step .av.big{font-size:2.4em}
.ph-top .me{display:inline-flex;align-items:center;gap:6px;border-color:var(--pc,var(--line));padding-left:4px}
.join form{gap:10px}
.ph-center.join{justify-content:flex-start;gap:10px;padding-top:6px}
.join .logo{width:min(170px,50%)}
.join .avb{font-size:1.35rem;border-radius:10px}
.me-prev{display:flex;align-items:center;gap:12px;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.5rem}
.pick-lbl{text-align:left;color:var(--muted);font-size:.85rem;font-weight:600;margin-top:4px}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avb{aspect-ratio:1;font-size:1.5rem;border-radius:12px;background:var(--card);border:2px solid transparent}
.avb.on{border-color:var(--gold);background:rgba(247,163,37,.18)}
.colrow{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.colb{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.colb.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.gear{opacity:.35}.gear:hover{opacity:1}
.ctl{font:inherit;font-size:.75em;padding:.5em 1.1em;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);opacity:.55;align-self:center}
.ctl:hover{opacity:1}
.lobby-foot{display:flex;justify-content:space-between;gap:20px;font-size:.8em}
.modal-box.wide{width:min(1000px,100%);overflow:auto}
.modal-box h3 small{font-size:.8rem;font-weight:400}
.set-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:760px){.set-grid{grid-template-columns:1fr}}
.sform{display:flex;flex-direction:column;gap:10px}
.sform>label,.srow>label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.85rem;font-weight:600}
.sform>label.tg{flex-direction:row;font-size:.95rem}
.sform input[type=text],.sform select{background:#0b1116;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:1rem}
.sform input[type=checkbox]{width:20px;height:20px}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scats{display:flex;flex-wrap:wrap;gap:6px}
.scats[hidden]{display:none}
.remote-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:#0003;border-radius:16px;padding:16px}
.qr.sm{background:#fff;padding:10px;border-radius:12px;line-height:0}
.pin{font-size:1.4rem;color:var(--gold);letter-spacing:.15em}
.cgu{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:.9rem;color:var(--muted)}
.cgu input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--gold)}
.cgu a{color:var(--gold)}
.rm{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px}
.rm .ph-center{min-height:70vh}
.rm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard h3{font-size:1.1rem}
.rpl{display:flex;flex-direction:column;gap:6px}
.rp{display:flex;align-items:center;gap:10px;background:#0003;border-left:5px solid var(--pc);border-radius:12px;padding:8px 10px;font-weight:600}
.rp.off{opacity:.45}.rp .nm{flex:1}.rp .sc{font-family:"Bricolage Grotesque";font-weight:800}
.rp .x{width:34px;height:34px;border-radius:10px;background:#0004;color:#ff8a80}
.rq{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:10px;justify-content:center;align-items:center}
.btn.big{font-size:1.2rem;padding:18px 26px;flex:1;max-width:520px}
.rq-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:600}
.rq-text{font-size:1.5rem;line-height:1.2}
.rans{display:grid;gap:8px}
.ra{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;font-weight:700;opacity:.55}
.ra.good{opacity:1;box-shadow:0 0 0 3px #fff}
.ra .lbl{flex:1}
.gold{color:var(--gold)}
.ph-form{display:grid;gap:10px;width:100%;max-width:320px}
.ph-form input{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:16px;font-size:1.4rem;text-align:center;letter-spacing:.3em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:none;padding:10px 14px;border-radius:12px 12px 4px 4px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:.9rem}
.tab.on{background:var(--wine);color:#fff;border-color:transparent}
.tab small{opacity:.8;margin-left:4px}
.bq{flex-direction:row!important;align-items:flex-start;gap:12px!important;cursor:pointer}
.bq input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--gold)}
.bq>span{display:flex;flex-direction:column;gap:6px}
.anec{background:rgba(247,163,37,.12);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;color:var(--text);font-size:.95rem;line-height:1.4}
.tv-anec{font-size:.9em;padding:.6em 1em;max-width:90%;align-self:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tvfoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1vw}
.credit{font-size:.6em;color:var(--muted);opacity:.7}
.lookq{font-size:1.3rem;font-weight:700;text-align:center;margin:10px 0;color:var(--gold)}
</style>

/* Réseau : STUN + relais TURN optionnel */
let ICE = null, HAS_TURN = false;
async function getIce(){
  if(ICE) return ICE;
  const base = [{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{urls:"stun:stun.cloudflare.com:3478"}];
  ICE = base;
  if(CONFIG.TURN_API_URL && !MOCK){
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 6000);
      const r = await fetch(CONFIG.TURN_API_URL, {signal:ctl.signal}); clearTimeout(t);
      const j = await r.json();
      if(Array.isArray(j) && j.length){ ICE = base.concat(j); HAS_TURN = true; }
    }catch(e){}
  }
  return ICE;
}
async function makePeer(id){
  const opts = Object.assign({debug:0, config:{iceServers: await getIce()}}, CONFIG.PEER_SERVER||{});
  return id ? new Peer(id, opts) : new Peer(opts);
}

/* Plein écran automatique de l'écran TV */
function goFS(){
  const d=document.documentElement, rfs=d.requestFullscreen||d.webkitRequestFullscreen;
  try{ if(rfs && !(document.fullscreenElement||document.webkitFullscreenElement)){ const p=rfs.call(d,{navigationUI:"hide"}); if(p&&p.then) p.then(()=>{ try{ screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(()=>{}); }catch(e){} }).catch(()=>{}); } }catch(e){}
}
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>document.body.classList.toggle("is-fs", !!(document.fullscreenElement||document.webkitFullscreenElement))));
let idleT=0; document.addEventListener("mousemove",()=>{ document.body.classList.remove("idle"); clearTimeout(idleT); idleT=setTimeout(()=>{ if(document.body.classList.contains("is-fs")) document.body.classList.add("idle"); },2500); });
document.addEventListener("dblclick", e => { if(typeof H!=="undefined" && H.code && !e.target.closest(".modal,input,select,button")) goFS(); });

async function startHost(resume){
  if(!peerOk()) return;
  keepAwake();
  app.innerHTML = `<div class="home"><div class="home-card ph-center"><div class="spin"></div><p id="st">Préparation de la connexion…</p></div></div>`;
  await getIce();
  let tries = 0, want = resume ? resume.code : (MOCK && QS.get("code")) ? QS.get("code").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4) : null;
  const tryOpen = async () => {
    H.code = want || Array.from({length:4},()=> "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join("");
    const peer = await makePeer(PREFIX + H.code);
    peer.on("open", () => {
      H.peer = peer; H.online = true; setNet(); banner(null);
      if(!H.qrNode || H.qrNode.dataset.code!==H.code) buildQR();
      if(resume){ const r=resume; resume=null; restore(r); } else renderHost();
    });
    peer.on("error", e => {
      if(e.type==="unavailable-id"){
        try{ peer.destroy(); }catch(_){}
        if(want){
          // après un rechargement, le serveur garde l'ancien code quelques instants
          if(++tries <= 40){ const st=$("#st"); if(st) st.textContent=`Récupération du code ${want}… (${tries}/40)`; setTimeout(tryOpen, 3000); }
          else { want=null; toast("Ancien code indisponible : nouveau code, les joueurs doivent rescanner"); tryOpen(); }
        } else tryOpen();
      }
      else if(["network","server-error","socket-error","socket-closed"].includes(e.type)){ H.online=false; setNet(); banner("Connexion au serveur perdue — reconnexion…"); setTimeout(()=>{ try{ if(peer.destroyed){ want=H.code; tryOpen(); } else if(peer.disconnected) peer.reconnect(); }catch(_){} }, 2500); }
    });
    peer.on("disconnected", () => { H.online=false; setNet(); banner("Connexion au serveur perdue — reconnexion…"); setTimeout(()=>{ try{ if(!peer.destroyed && peer.disconnected) peer.reconnect(); }catch(e){} }, 1500); });
    peer.on("connection", conn => {
      conn.on("data", d => hostData(conn, d));
      conn.on("close", () => { const p = conn.pid && H.players.get(conn.pid); if(p && p.conn===conn){ p.connected=false; onRosterChange(); } });
      conn.on("error", () => {});
    });
  };
  tryOpen();
  if(!startHost._bound){
    startHost._bound = true;
    document.addEventListener("keydown", e => {
      if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || $(".modal")) return;
      if(e.code==="Space"||e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); advance(); }
      if(e.key==="r"||e.key==="R") openHostSettings();
    });
    document.addEventListener("visibilitychange", keepAwake);
    window.addEventListener("storage", e => { if(e.key==="qb_quizzes" && H.phase==="lobby" && !$(".modal")) renderLobby(); });
    window.addEventListener("focus", () => { if(H.phase==="lobby" && $("#quiz") && !$(".modal")) renderLobby(); });
    window.addEventListener("beforeunload", e => { if(H.phase!=="lobby"){ saveGame(); e.preventDefault(); e.returnValue=""; } });
  }
}

function restore(sv){
  H.phase = sv.phase; H.qs = sv.qs||[]; H.src = sv.src||""; H.qi = sv.qi; H.answers = new Map(sv.answers||[]); H.lastGain = new Map(sv.lastGain||[]);

function hostData(conn, d){
  if(!d || typeof d!=="object") return;
  if(adminData(conn, d)) return;
  if(d.t==="join"){
    if(d.cgu!==CGU_VERSION){ try{ conn.send({t:"needcgu"}); }catch(e){} return; }
    let pid = typeof d.pid==="string" && d.pid.length<=20 ? d.pid : rid();
    let name = String(d.name||"").replace(/\s+/g," ").trim().slice(0,16) || "Joueur";
    const av = okAv(d.av), col = okCol(d.col);
    let p = H.players.get(pid);
    const taken = n => [...H.players.values()].some(o => o.pid!==pid && o.name.toLowerCase()===n.toLowerCase());
    if(!p){
      let base=name, k=2; while(taken(name)) name = (base.slice(0,13)+" "+k++);
      p = {pid, name, av, col, score:0, streak:0, connected:true, conn};
      H.players.set(pid, p);
    } else {
      if(p.conn && p.conn!==conn) try{ p.conn.close(); }catch(e){}
      p.conn = conn; p.connected = true; p.av = av; p.col = col;
      if(H.phase==="lobby" && name!==p.name){ let base=name, k=2; while(taken(name)) name = (base.slice(0,13)+" "+k++); p.name = name; }
    }
    conn.pid = pid;
    send(p, playerState(p));
    onRosterChange(); saveGame();
  }
  else if(d.t==="answer"){
    const p = H.players.get(conn.pid);
    if(!p || H.phase!=="question" || d.qi!==H.qi || H.answers.has(p.pid)) return;
    const c = d.choice|0; if(c<0||c>=H.qs[H.qi].choices.length) return;
    H.answers.set(p.pid, {choice:c, t:Date.now()-H.qStart});
    send(p, playerState(p)); saveGame(); sendAdmins();
    const el = $("#ans"); if(el) el.textContent = H.answers.size;
    if(H.answers.size >= connectedCount()) setTimeout(()=>{ if(H.phase==="question") reveal(); }, 400);
  }
  else if(d.t==="ping"){ try{ conn.send({t:"pong"}); }catch(e){} }
}
function send(p, msg){ try{ if(p.conn && p.conn.open) p.conn.send(msg); }catch(e){} }
function broadcast(){ H.players.forEach(p => send(p, playerState(p))); }
function connectedCount(){ let n=0; H.players.forEach(p=>{ if(p.connected) n++; }); return n; }
function ranking(){
  const arr = [...H.players.values()].sort((a,b)=>b.score-a.score);
  let rank=0, prev=null; arr.forEach((p,i)=>{ if(p.score!==prev){ rank=i+1; prev=p.score; } p.rank=rank; });
  return arr;
}
function onRosterChange(){
  sendAdmins();
  if(H.phase==="lobby") renderLobbyPlayers();
  else if(H.phase==="question"){
    const el=$("#tot"); if(el) el.textContent=connectedCount();
    if(H.answers.size>0 && H.answers.size >= connectedCount()) reveal();
  }
}

function playerState(p){
  const s = {t:"state", pid:p.pid, name:p.name, av:p.av, col:p.col, phase:H.phase, score:p.score, players:H.players.size, bar:H.settings.bar};
  const q = H.qs[H.qi];
  if(H.phase==="question"){
    Object.assign(s,{qi:H.qi,total:H.qs.length,cat:q.c,text:H.settings.hideQ?null:q.q,choices:q.choices,
      endsIn:Math.max(0, H.settings.time*1000-(Date.now()-H.qStart)), answered: H.answers.has(p.pid)?H.answers.get(p.pid).choice:null});
  } else if(H.phase==="reveal"||H.phase==="leaderboard"){
    ranking();
    const a = H.answers.get(p.pid);
    Object.assign(s,{qi:H.qi,total:H.qs.length,correct:q.correct,correctText:q.choices[q.correct],
      mine:a?a.choice:null, gain:H.lastGain.get(p.pid)||0, rank:p.rank, streak:p.streak});
  } else if(H.phase==="end"){
    const r = ranking();
    Object.assign(s,{rank:p.rank, podium:r.slice(0,3).map(x=>({name:x.name,score:x.score,av:x.av,col:x.col}))});
  }
  return s;
}

/* --- déroulé de partie --- */
function buildPool(){
  const s = H.settings, z = s.quiz!=="builtin" ? QZ.get(s.quiz) : null;
  if(z) return z.shuffle ? shuffle(z.qs) : z.qs.slice();
  return shuffle(bank().filter(q => s.cats.includes(q[0])).map(([k,q,a])=>({c:CATS[k],q,a})));
}
function startGame(){
  const pool = buildPool();
  if(!pool.length){ toast("Aucune question : choisis des catégories ou un quiz qui contient des questions"); return; }
  const zq = H.settings.quiz!=="builtin" ? QZ.get(H.settings.quiz) : null; H.src = (zq && zq.source) || "";
  H.qs = pool.slice(0, H.settings.n || pool.length).map(({c,q,a,info}) => {
    const order = shuffle(a.map((_,i)=>i));
    return {c, q, info, choices:order.map(i=>a[i]), correct:order.indexOf(0)};
  });
  H.players.forEach(p => { p.score=0; p.streak=0; });
  H.qi = -1; nextQuestion();
}
function startSaveLoop(){ clearInterval(H.saveI); H.saveI = setInterval(()=>{ if(H.phase==="question") saveGame(); else clearInterval(H.saveI); }, 1000); }
function nextQuestion(){
  clearTimers();
  H.qi++;
  if(H.qi >= H.qs.length) return endGame();
  H.phase="question"; H.answers.clear(); H.lastGain.clear(); H.qStart = Date.now();
  broadcast(); renderHost(); saveGame(); startSaveLoop();
  H.timeout = setTimeout(reveal, H.settings.time*1000 + 300);
}
function reveal(){
  if(H.phase!=="question") return;
  clearTimers();
  const q = H.qs[H.qi], limit = H.settings.time*1000;
  H.players.forEach(p => {
    const a = H.answers.get(p.pid);
    if(a && a.choice===q.correct){
      p.streak++;
      const g = Math.round(500 + 500*Math.max(0, 1 - a.t/limit)) + Math.min(p.streak-1,3)*50;
      p.score += g; H.lastGain.set(p.pid, g);
    } else { p.streak = 0; H.lastGain.set(p.pid, 0); }
  });
  H.phase="reveal"; broadcast(); renderHost(); saveGame();
  if(H.settings.auto) H.autoT = setTimeout(advance, 7000);
}
function showBoard(){ clearTimers(); H.phase="leaderboard"; broadcast(); renderHost(); saveGame(); if(H.settings.auto) H.autoT=setTimeout(advance, 6000); }
function endGame(){
  clearTimers(); H.phase="end"; broadcast(); renderHost(); saveGame();
}
function backToLobby(){ clearTimers(); H.phase="lobby"; H.qi=-1; H.players.forEach(p=>{p.score=0;p.streak=0}); [...H.players].forEach(([id,p])=>{ if(!p.connected) H.players.delete(id); }); broadcast(); renderHost(); saveGame(); }
function advance(){
  if(H.phase==="question") reveal();
  else if(H.phase==="reveal") (H.qi >= H.qs.length-1) ? endGame() : showBoard();
  else if(H.phase==="leaderboard") nextQuestion();
}
function clearTimers(){ clearTimeout(H.timeout); clearTimeout(H.autoT); clearInterval(H.saveI); cancelAnimationFrame(H.raf); }

function splitCSV(line, sep){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"' && !cur.trim()) q=true; else if(ch===sep){ out.push(cur); cur=""; } else cur+=ch; }
  out.push(cur); return out.map(x=>x.trim());
}
function parseCSV(txt){
  const ok=[], bad=[], seen=new Set();
  const lines = String(txt).replace(/^\uFEFF/,"").split(/\r?\n/);
  const first = lines.find(l=>l.trim())||"";
  const sep = first.includes(";") ? ";" : first.includes("\t") ? "\t" : ",";
  lines.forEach((line,i)=>{
    if(!line.trim() || /^\s*"?cat[ée]gorie"?\s*[;\t,]/i.test(line)) return;
    const f=splitCSV(line, sep);
    const ans=f.slice(2,6).filter(Boolean);
    if(f.length>=4 && f[1] && f[2] && ans.length>=2){ const k=normQ(f[1]); if(seen.has(k)) return; seen.add(k); ok.push([f[0]||"Quiz", f[1], ans]); } else bad.push(i+1);
  });
  return {ok,bad};
}

const QZ = {
  all(){
    let l = store.get("qb_quizzes", null);
    if(!Array.isArray(l)){ l = []; const old = store.get("qb_custom", []); if(old.length) l.push({id:rid(6), name:"Mes questions", shuffle:true, qs:old.map(([c,q,a])=>({c,q,a}))}); store.set("qb_quizzes", l); }
    return l;
  },
  get(id){ return this.all().find(x=>x.id===id) || null; },
  put(qz){ const l=this.all(), i=l.findIndex(x=>x.id===qz.id); qz.updated=Date.now(); if(i>=0) l[i]=qz; else l.push(qz); store.set("qb_quizzes", l); },
  del(id){ store.set("qb_quizzes", this.all().filter(x=>x.id!==id)); }
};
function cleanQuiz(o, fallbackName){
  // accepte un quiz exporté (JSON) et le nettoie
  const qs = (Array.isArray(o.qs)?o.qs:[]).map(x=>{ const y={c:String(x.c||"Quiz").slice(0,40), q:String(x.q||"").slice(0,300), a:(Array.isArray(x.a)?x.a:[]).map(v=>String(v).slice(0,120)).filter(v=>v.trim()).slice(0,4)}; if(x.info) y.info=String(x.info).slice(0,400); return y; }).filter(x=>x.q.trim() && x.a.length>=2);
  const z = {id:rid(6), name:String(o.name||fallbackName||"Quiz importé").slice(0,60), shuffle:o.shuffle!==false, qs};
  if(o.source) z.source = String(o.source).slice(0,120);
  return z;
}
/* Import des fichiers JSON d'OpenQuizzDB (openquizzdb.org, licence CC BY-SA 4.0) */
const OQDB_SOURCE = "OpenQuizzDB (openquizzdb.org) · CC BY-SA 4.0";
function parseOQDB(o, fname){
  if(!o || typeof o!=="object") return null;
  const meta = o["catégorie-nom-slogan"] || o["categorie-nom-slogan"] || {};
  const m = meta.fr || Object.values(meta)[0] || {};
  const name = m.nom || m.name || o.nom || fname || "Quiz OpenQuizzDB";
  const cat = m["catégorie"] || m.categorie || m.category || name;
  let root = o.quizz || o.quiz || o;
  if(root && root.fr) root = root.fr;
  const out = [], seen = new Set();
  (function walk(n, lvl){
    if(Array.isArray(n)) return n.forEach(x=>walk(x, lvl));
    if(!n || typeof n!=="object") return;
    const props = n.propositions || n.choix || n.answers;
    if(typeof n.question==="string" && Array.isArray(props)){
      const p = props.map(v=>String(v).trim()).filter(Boolean);
      const rep = n["réponse"] ?? n.reponse ?? n.answer;
      const good = typeof rep==="number" ? p[rep] : String(rep||"").trim();
      const gi = p.findIndex(v=>normQ(v)===normQ(good));
      const k = normQ(n.question);
      if(gi>=0 && p.length>=2 && !seen.has(k)){
        seen.add(k);
        const y = {c:String(cat).slice(0,40), q:n.question.trim().slice(0,300), a:[p[gi], ...p.filter((_,i)=>i!==gi)].slice(0,4).map(v=>v.slice(0,120))};
        if(n.anecdote) y.info = String(n.anecdote).trim().slice(0,400);
        out.push(y);
      }
      return;
    }
    for(const [key,v] of Object.entries(n)) walk(v, key);
  })(root, "");
  return out.length ? {id:rid(6), name:String(name).slice(0,60), shuffle:true, qs:out, source:OQDB_SOURCE} : null;
}
function shareOrDownload(name, text){
  const blob = new Blob([text], {type:"application/json"});
  try{ const f = new File([blob], name, {type:"application/json"}); if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f], title:name}).catch(()=>{}); return; } }catch(e){}
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function readFile(f){ return new Promise(res=>{ const rd=new FileReader(); rd.onload=()=>{ const t=String(rd.result); if(/\uFFFD/.test(t)){ const r2=new FileReader(); r2.onload=()=>res(String(r2.result)); r2.readAsText(f,"windows-1252"); } else res(t); }; rd.readAsText(f,"utf-8"); }); }
function slug(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase() || "quiz"; }

function edShell(title, body, back){
  app.innerHTML = `<div class="ed">
    <div class="ed-top">${back?`<button class="btn ghost sm" id="back">← ${back}</button>`:`<a class="btn ghost sm" href="${location.pathname}">← Accueil</a>`}<img class="logo mini" src="logo.png" alt=""></div>
    <h2>${title}</h2>${body}</div>`;
}

function editorHome(){
  const l = QZ.all();
  edShell("🛠️ Mes quiz", `
    <p class="muted"><a href="modele-questions.csv" download>📄 Télécharger le modèle d'import (Excel)</a></p>
    <p class="muted">Créez vos propres quiz. Ils sont enregistrés sur cet appareil. Pour jouer sur l'ordinateur de la TV, utilisez <b>Exporter</b> puis <b>Importer</b> là-bas (ou créez-les directement sur l'ordinateur de la TV).</p>
    <div class="ed-actions"><button class="btn" id="new">+ Nouveau quiz</button><button class="btn ghost" id="bk">📚 Banque de questions (${bank().length})</button><label class="btn ghost">📥 Importer un fichier<input type="file" id="imp" multiple accept=".json,.csv,.txt,application/json,text/csv,text/plain" hidden></label></div>
    <div class="ed-list">${l.length ? l.map(z=>`
      <button class="ed-item" data-id="${z.id}"><span><b>${esc(z.name)}</b><small>${z.qs.length} question${z.qs.length>1?'s':''}${z.shuffle?' · ordre aléatoire':''}</small></span><span>›</span></button>`).join("")
      : `<p class="muted">Aucun quiz pour l'instant.</p>`}</div>`);
  $("#bk").onclick = () => bankView();
  $("#new").onclick = () => { const name = prompt("Nom du quiz ?", "Quiz du " + new Date().toLocaleDateString("fr-FR")); if(!name) return; const z={id:rid(6), name:name.trim().slice(0,60)||"Mon quiz", shuffle:false, qs:[]}; QZ.put(z); editQuiz(z.id); };
  $("#imp").onchange = async e => {
    const files=[...e.target.files]; let last=null, total=0, failed=[];
    for(const f of files){
      const txt = await readFile(f), base = f.name.replace(/\.\w+$/,""); let z = null;
      try{ const o = JSON.parse(txt); z = (o && Array.isArray(o.qs)) ? cleanQuiz(o, base) : Array.isArray(o) && o[0] && o[0].q ? cleanQuiz({qs:o}, base) : parseOQDB(o, base); }
      catch(_){ const r = parseCSV(txt); z = {id:rid(6), name:base, shuffle:true, qs:r.ok.map(([c,q,a])=>({c,q,a}))}; }
      if(!z || !z.qs.length){ failed.push(f.name); continue; }
      QZ.put(z); last=z; total+=z.qs.length;
    }
    if(failed.length) toast(`Aucune question lisible dans : ${failed.join(", ")}. Pour OpenQuizzDB, choisissez le format JSON.`);
    if(last){ toast(`${files.length-failed.length} quiz importé(s) : ${total} questions`); files.length-failed.length>1 ? editorHome() : editQuiz(last.id); }
  };
  app.querySelectorAll(".ed-item").forEach(b => b.onclick = () => editQuiz(b.dataset.id));
}

function editQuiz(id){
  const z = QZ.get(id); if(!z) return editorHome();
  edShell(`<input class="ed-title" id="nm" value="${esc(z.name)}" maxlength="60" aria-label="Nom du quiz">`, `
    <div class="ed-actions">
      <label class="tg"><input type="checkbox" id="shuf" ${z.shuffle?'checked':''}> Questions dans un ordre aléatoire</label>
    </div>
    <div class="ed-list" id="ql">${z.qs.map((x,i)=>`
      <div class="ed-q">
        <div class="ed-qh"><span class="pill sm">${esc(x.c)}</span><span class="muted">#${i+1}</span></div>
        <div class="ed-qt">${esc(x.q)}</div>
        <div class="ed-ans">${x.a.map((v,k)=>`<span class="${k===0?'good':''}">${k===0?'✓ ':''}${esc(v)}</span>`).join("")}</div>
        <div class="ed-qa"><button data-a="edit" data-i="${i}">✏️ Modifier</button><button data-a="up" data-i="${i}" ${i?'':'disabled'}>↑</button><button data-a="down" data-i="${i}" ${i<z.qs.length-1?'':'disabled'}>↓</button><button data-a="del" data-i="${i}" class="danger">🗑</button></div>
      </div>`).join("") || `<p class="muted">Pas encore de question. Ajoutez la première !</p>`}</div>
    <div class="ed-actions sticky">
      <button class="btn" id="add">+ Ajouter une question</button>
      <button class="btn ghost" id="bulk">📋 Ajouter en lot</button>
    </div>
    <div class="ed-actions">
      <button class="btn ghost" id="exp">📤 Exporter / partager</button>
      <button class="btn ghost" id="dup">⧉ Dupliquer</button>
      <button class="btn ghost danger" id="rm">Supprimer le quiz</button>
    </div>`, "Mes quiz");
  $("#back").onclick = editorHome;
  $("#nm").onchange = e => { z.name = e.target.value.trim().slice(0,60) || "Mon quiz"; QZ.put(z); };
  $("#shuf").onchange = e => { z.shuffle = e.target.checked; QZ.put(z); };
  $("#add").onclick = () => editQuestion(z, null);
  $("#bulk").onclick = () => openBulk(z);
  $("#exp").onclick = () => shareOrDownload(`quiz-${slug(z.name)}.json`, JSON.stringify({app:"vandb-quizz", v:1, name:z.name, shuffle:z.shuffle, source:z.source, qs:z.qs}, null, 1));
  $("#dup").onclick = () => { const c = JSON.parse(JSON.stringify(z)); c.id=rid(6); c.name=(z.name+" (copie)").slice(0,60); QZ.put(c); editQuiz(c.id); };
  $("#rm").onclick = () => { if(confirm(`Supprimer « ${z.name} » et ses ${z.qs.length} questions ?`)){ QZ.del(z.id); editorHome(); } };
  app.querySelectorAll(".ed-qa button").forEach(b => b.onclick = () => {
    const i=+b.dataset.i, a=b.dataset.a;
    if(a==="edit") return editQuestion(z, i);
    if(a==="del"){ if(!confirm("Supprimer cette question ?")) return; z.qs.splice(i,1); }
    if(a==="up"&&i>0) [z.qs[i-1],z.qs[i]]=[z.qs[i],z.qs[i-1]];
    if(a==="down"&&i<z.qs.length-1) [z.qs[i+1],z.qs[i]]=[z.qs[i],z.qs[i+1]];
    QZ.put(z); editQuiz(z.id);
  });
}

function editQuestion(z, idx){
  const x = idx==null ? {c: (z.qs[z.qs.length-1]||{}).c || "Culture G", q:"", a:["","","",""]} : z.qs[idx];
  const a = x.a.concat(["","","",""]).slice(0,4);
  const cats = [...new Set(QZ.all().flatMap(q=>q.qs.map(y=>y.c)).concat(Object.values(CATS)))];
  edShell(idx==null ? "Nouvelle question" : `Question #${idx+1}`, `
    <form id="qf" class="ed-form">
      <label>Catégorie<input id="c" list="catl" value="${esc(x.c)}" maxlength="40" required><datalist id="catl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      <label>Question<textarea id="q" rows="3" maxlength="300" required placeholder="Ex. : Quel cépage est roi en Bourgogne ?">${esc(x.q)}</textarea></label>
      <div class="muted">Réponses (2 à 4). Cochez la bonne réponse.</div>
      ${a.map((v,k)=>`<div class="ed-a c${k}"><span class="shape">${SHAPES[k]}</span><input id="a${k}" value="${esc(v)}" maxlength="120" placeholder="${k<2?'Réponse '+(k+1):'Réponse '+(k+1)+' (facultatif)'}"><label class="ok"><input type="radio" name="ok" value="${k}" ${k===0?'checked':''}> Bonne</label></div>`).join("")}
      <div class="ed-actions sticky"><button class="btn" type="submit">Enregistrer</button>${idx==null?`<button class="btn ghost" type="button" id="again">Enregistrer + nouvelle</button>`:''}</div>
      <p class="muted" id="err"></p>
    </form>`, z.name.slice(0,24));
  $("#back").onclick = () => editQuiz(z.id);
  const save = () => {
    const ok = +app.querySelector('input[name=ok]:checked').value;
    const vals = [0,1,2,3].map(k=>$("#a"+k).value.trim());
    if(!vals[ok]){ $("#err").textContent = "La bonne réponse cochée est vide."; return false; }
    const others = vals.filter((v,k)=>k!==ok && v);
    if(!others.length){ $("#err").textContent = "Ajoutez au moins une mauvaise réponse."; return false; }
    const q = {c:$("#c").value.trim()||"Quiz", q:$("#q").value.trim(), a:[vals[ok], ...others]};
    if(idx!=null && x.info) q.info = x.info;
    if(!q.q){ $("#err").textContent = "La question est vide."; return false; }
    if(idx==null) z.qs.push(q); else z.qs[idx]=q;
    QZ.put(z); return true;
  };
  $("#qf").onsubmit = e => { e.preventDefault(); if(save()) editQuiz(z.id); };
  if($("#again")) $("#again").onclick = () => { if(save()){ toast("Question ajoutée"); editQuestion(z, null); } };
  if(idx==null) $("#q").focus();
}

function openBulk(z){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="modal-box">
    <h3>📋 Ajouter en lot</h3>
    <p>Une question par ligne : <code>Catégorie;Question;Bonne réponse;Faux 1;Faux 2;Faux 3</code> (2 à 4 réponses). Idéal pour coller depuis Excel ou Notes.</p>
    <textarea id="csv" placeholder="Musique;Qui chante « La Bohème » ?;Charles Aznavour;Jacques Brel;Édith Piaf;Serge Gainsbourg"></textarea>
    <div class="modal-row"><span id="msg" class="muted"></span><span style="flex:1"></span><button class="btn ghost" id="cl">Annuler</button><button class="btn" id="sv">Ajouter</button></div></div>`;
  document.body.appendChild(m);
  const area=$("#csv"), msg=$("#msg");
  const check=()=>{ const r=parseCSV(area.value); msg.textContent=`${r.ok.length} question(s) valide(s)`+(r.bad.length?` · lignes ignorées : ${r.bad.slice(0,8).join(", ")}${r.bad.length>8?"…":""}`:""); return r; };
  area.oninput=check; check();
  $("#cl").onclick=()=>m.remove();
  $("#sv").onclick=()=>{ const r=check(); const have=new Set(z.qs.map(x=>normQ(x.q))); let n=0; r.ok.forEach(([c,q,a])=>{ if(have.has(normQ(q))) return; have.add(normQ(q)); z.qs.push({c,q,a}); n++; }); QZ.put(z); m.remove(); toast(`${n} question(s) ajoutée(s)`+(r.ok.length-n?` · ${r.ok.length-n} doublon(s) ignoré(s)`:'')); editQuiz(z.id); };
}

function choicesHTML(q, withCounts){
  const counts=[0,0,0,0]; H.answers.forEach(a=>counts[a.choice]++);
  const max = Math.max(1, ...counts);
  return `<div class="choices">${q.choices.map((c,i)=>`
    <div class="ch c${i} ${withCounts?(i===q.correct?'right':'wrong'):''}">
      ${withCounts?`<div class="fill" style="transform:scaleX(${counts[i]/max})"></div>`:''}
      <span class="shape">${SHAPES[i]}</span><span class="lbl">${esc(c)}</span>
      ${withCounts?`<span class="cnt">${counts[i]}</span>`:''}
    </div>`).join("")}</div>`;
}
function renderQuestion(){
  const q=H.qs[H.qi];
  app.innerHTML = `<div class="tv">${head()}
    <div class="qtop"><span class="pill">${esc(q.c)}</span><span>Question ${H.qi+1} / ${H.qs.length}</span><span class="answered"><b id="ans">${H.answers.size}</b> / <span id="tot">${connectedCount()}</span> réponses</span></div>
    <h2 class="qtext">${esc(q.q)}</h2>
    <div class="timer"><div class="track"><div class="bar" id="bar"></div></div><span class="secs" id="secs">${H.settings.time}</span></div>
    ${choicesHTML(q,false)}
    <div class="tvfoot"><span class="credit">${H.src?'Questions : '+esc(H.src):''}</span><button class="ctl" id="rv">Dévoiler ▶</button><span class="credit"></span></div></div>`;
  bindHead();
  $("#rv").onclick = advance;
  const limit=H.settings.time*1000, bar=$("#bar"), secs=$("#secs");
  const tick=()=>{ const left=Math.max(0,limit-(Date.now()-H.qStart)); bar.style.transform=`scaleX(${left/limit})`; const s=Math.ceil(left/1000); secs.textContent=s; secs.classList.toggle("hot",s<=5); if(left>0&&H.phase==="question") H.raf=requestAnimationFrame(tick); };
  tick();
}
function renderReveal(){
  const q=H.qs[H.qi], last=H.qi>=H.qs.length-1;
  app.innerHTML = `<div class="tv reveal">${head()}
    <div class="qtop"><span class="pill">${esc(q.c)}</span><span>Question ${H.qi+1} / ${H.qs.length}</span><span class="answered"><b>${H.answers.size}</b> réponses</span></div>
    <h2 class="qtext">${esc(q.q)}</h2>
    ${choicesHTML(q,true)}
    ${q.info?`<p class="anec tv-anec">💡 ${esc(q.info)}</p>`:''}
    <div class="tvfoot"><span class="credit">${H.src?'Questions : '+esc(H.src):''}</span><button class="ctl" id="nx">${last?'Résultats ▶':'Classement ▶'}</button><span class="credit"></span></div></div>`;
  bindHead(); $("#nx").onclick=advance;
}
function renderBoard(){
  const r=ranking().slice(0,8);
  app.innerHTML = `<div class="tv">${head()}
    <div class="lb"><h2>Classement après ${H.qi+1} question${H.qi?'s':''}</h2>
    ${r.map((p,i)=>`<div class="row" style="animation-delay:${i*70}ms;--pc:${okCol(p.col)}"><span class="rk">${p.rank}</span>${avHTML(p)}<span class="nm">${esc(p.name)}</span>${H.lastGain.get(p.pid)?`<span class="gain">+${H.lastGain.get(p.pid)}</span>`:''}<span class="sc">${p.score}</span></div>`).join("") || '<p class="empty">Aucun joueur</p>'}
    </div>
    <button class="ctl next" id="nx">Suivant ▶</button></div>`;
  bindHead(); $("#nx").onclick=advance;
}
function renderEnd(){
  const r=ranking(), [a,b,c]=r;
  const step=(p,cls,n)=>p?`<div class="step ${cls}">${avHTML(p,"big")}<div class="who">${esc(p.name)}</div><div class="pts">${p.score} pts</div><div class="blk">${n}</div></div>`:`<div class="step ${cls}"></div>`;
  app.innerHTML = `<div class="tv">${head()}
    <h2 style="text-align:center;font-size:2.6em">🏆 Podium</h2>
    <div class="podium">${step(b,"p2",2)}${step(a,"p1",1)}${step(c,"p3",3)}</div>
    <div style="display:flex;justify-content:center"><button class="ctl" id="again">Nouvelle partie</button></div></div>`;
  bindHead(); $("#again").onclick=backToLobby;
}

/* ===================== RÉGLAGES (partagés TV / télécommande) ===================== */
function settingsHTML(s, quizzes, nb){
  return `<div class="sform">
    <label>Nom du bar<input type="text" data-k="bar" value="${esc(s.bar)}" maxlength="24"></label>
    <label>Quiz<select data-k="quiz"><option value="builtin">Culture G (${nb} questions)</option>${quizzes.map(z=>`<option value="${esc(z.id)}" ${s.quiz===z.id?'selected':''}>${esc(z.name)} (${z.n})</option>`).join("")}</select></label>
    <div class="scats" ${s.quiz==="builtin"?'':'hidden'}>${Object.entries(CATS).map(([k,v])=>`<button type="button" class="cat ${s.cats.includes(k)?'on':''}" data-cat="${k}">${v}</button>`).join("")}</div>
    <div class="srow">
      <label>Questions<select data-k="n">${[5,10,15,20,25,30,40].map(v=>`<option value="${v}" ${v===s.n?'selected':''}>${v}</option>`).join("")}<option value="0" ${s.n===0?'selected':''}>Toutes</option></select></label>
      <label>Temps<select data-k="time">${[10,15,20,30,45,60].map(v=>`<option value="${v}" ${v===s.time?'selected':''}>${v} s</option>`).join("")}</select></label>
    </div>
    <label class="tg"><input type="checkbox" data-k="auto" ${s.auto?'checked':''}> Enchaînement automatique</label>
    <label class="tg"><input type="checkbox" data-k="hideQ" ${s.hideQ?'checked':''}> Question seulement sur la TV (anti-triche)</label>
  </div>`;
}
function bindSettings(root, apply){
  root.querySelectorAll("[data-k]").forEach(el => {
    const fire = () => { const k=el.dataset.k; const v = el.type==="checkbox" ? el.checked : (k==="n"||k==="time") ? +el.value : el.value;
      if(k==="quiz"){ const c=root.querySelector(".scats"); if(c) c.hidden = v!=="builtin"; } apply(k, v); };
    if(el.type==="text") el.oninput = fire; else el.onchange = fire;
  });
  root.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    b.classList.toggle("on");
    let cats = [...root.querySelectorAll("[data-cat].on")].map(x=>x.dataset.cat);
    if(!cats.length){ b.classList.add("on"); cats=[b.dataset.cat]; }
    apply("cats", cats);
  });
}
function applySetting(k, v){
  const s = H.settings;
  if(k==="bar") s.bar = String(v||"").trim().slice(0,24) || "V and B";
  else if(k==="quiz") s.quiz = (v==="builtin" || QZ.get(v)) ? v : "builtin";
  else if(k==="n") s.n = [0,5,10,15,20,25,30,40].includes(+v) ? +v : 15;
  else if(k==="time") s.time = [10,15,20,30,45,60].includes(+v) ? +v : 20;
  else if(k==="auto"||k==="hideQ") s[k] = !!v;
  else if(k==="cats" && Array.isArray(v)){ const c=v.filter(x=>CATS[x]); if(c.length) s.cats=c; }
  else return;
  saveSettings();
  if(H.phase==="lobby" && !$(".modal")) renderLobby(); else { const i=$("#qinfo"); if(i) i.textContent=quizInfo(); }
  sendAdmins();
}
function quizInfo(){
  const s=H.settings, z = s.quiz!=="builtin" ? QZ.get(s.quiz) : null;
  const total = z ? z.qs.length : bank().filter(q=>s.cats.includes(q[0])).length;
  const n = s.n ? Math.min(s.n,total) : total;
  return `${z ? z.name : "Culture G"} · ${n} question${n>1?'s':''} · ${s.time} s${z && z.source ? " · Questions : "+z.source : ""}`;
}
const adminUrl = () => location.origin + location.pathname + "?room=" + H.code + "&admin=" + H.pin;
function openHostSettings(){
  if($(".modal")) return;
  const s=H.settings, quizzes=QZ.all().map(z=>({id:z.id,name:z.name,n:z.qs.length}));
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="modal-box wide">
    <h3>⚙️ Réglages de la partie <small class="muted">(visible seulement quand vous ouvrez ce menu)</small></h3>
    <div class="set-grid">
      <div>${settingsHTML(s, quizzes, bank().length)}
        <div class="modal-row"><button class="btn ghost" id="edit">🛠️ Créer / modifier mes quiz</button></div></div>
      <div class="remote-card"><div id="aqr" class="qr sm"></div>
        <div><b>🎛️ Télécommande</b><p>Scannez avec votre téléphone ou tablette pour piloter la partie depuis le micro : lancer, avancer, voir la bonne réponse.</p><p>Code ${H.code} · PIN <b class="pin">${H.pin}</b></p></div></div>
    </div>
    <div class="modal-row"><span style="flex:1"></span><button class="btn ghost" id="cl">Fermer</button>${H.phase==="lobby"?`<button class="btn" id="go" ${H.players.size?'':'disabled'}>Lancer la partie ▶</button>`:`<button class="btn ghost" id="stop">⏹ Arrêter la partie</button>`}</div></div>`;
  document.body.appendChild(m);
  const qr=$("#aqr");
  if(window.QRCode) new QRCode(qr,{text:adminUrl(),width:200,height:200,colorDark:"#151e25",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  bindSettings(m, applySetting);
  const close = () => { m.remove(); if(H.phase==="lobby") renderLobby(); };
  $("#cl").onclick = close; m.onclick = e => { if(e.target===m) close(); };
  $("#edit").onclick = () => window.open(location.pathname+"?edit=1", "_blank");
  if($("#go")) $("#go").onclick = () => { m.remove(); startGame(); };
  if($("#stop")) $("#stop").onclick = () => { if(confirm("Arrêter la partie et revenir à la salle d'attente ?")){ m.remove(); backToLobby(); } };
}
function kickPlayer(pid){
  const p=H.players.get(pid); if(!p) return;
  send(p,{t:"kicked"}); setTimeout(()=>{try{p.conn.close()}catch(e){}},300);
  H.players.delete(pid); if(H.phase==="lobby") renderLobbyPlayers(); saveGame(); sendAdmins();
}
function adminState(){
  const q=H.qs[H.qi], counts=[0,0,0,0]; H.answers.forEach(a=>counts[a.choice]++);
  const r=ranking();
  return {t:"astate", code:H.code, phase:H.phase, settings:H.settings, nb:bank().length, info:quizInfo(),
    quizzes:QZ.all().map(z=>({id:z.id,name:z.name,n:z.qs.length})),
    players:r.map(p=>({pid:p.pid,name:p.name,av:p.av,col:p.col,on:p.connected,score:p.score,rank:p.rank,gain:H.lastGain.get(p.pid)||0})),
    qi:H.qi, total:H.qs.length, q:(q && H.phase!=="lobby" && H.phase!=="end") ? {c:q.c,q:q.q,info:q.info||"",choices:q.choices,correct:q.correct} : null,
    answered:H.answers.size, connected:connectedCount(), counts,
    endsIn: H.phase==="question" ? Math.max(0, H.settings.time*1000-(Date.now()-H.qStart)) : 0};
}
let adminT=0;
function sendAdmins(){ clearTimeout(adminT); adminT=setTimeout(()=>{ if(!H.admins.size) return; const st=adminState(); H.admins.forEach(c=>{ try{ if(c.open) c.send(st); else H.admins.delete(c); }catch(e){} }); }, 50); }
function adminData(conn, d){
  if(d.t==="admin"){
    if(String(d.pin)===H.pin){ conn.admin=true; H.admins.add(conn); conn.on("close",()=>H.admins.delete(conn)); try{ conn.send(adminState()); }catch(e){} }
    else { try{ conn.send({t:"badpin"}); }catch(e){} }
    return true;
  }
  if(!conn.admin) return false;
  if(d.t==="set") applySetting(d.k, d.v);
  else if(d.t==="cmd"){
    if(d.c==="start" && H.phase==="lobby") startGame();
    else if(d.c==="advance") advance();
    else if((d.c==="lobby" && H.phase==="end") || (d.c==="stop" && H.phase!=="lobby")){ const m=$(".modal"); if(m) m.remove(); backToLobby(); }
    else if(d.c==="kick") kickPlayer(String(d.pid));
  }
  else if(d.t==="pushquiz" && d.quiz){
    const z=cleanQuiz(d.quiz); const id=String(d.quiz.id||"").replace(/[^a-z0-9]/gi,"").slice(0,12);

  }
  return true;
}

const A = {peer:null, conn:null, pin:"", st:null, raf:0, endsAt:0, rt:0, view:"", qsig:""};
function adminRemote(pin){
  A.pin = String(pin||store.get("qb_apin_"+ROOM,"")||"").replace(/\D/g,"").slice(0,6);
  if(!A.pin) return aPinForm();
  aConnect();
}
function aPinForm(err){
  A.view="";
  app.innerHTML = `<div class="rm"><div class="rm-top"><span class="kicker">🎛️ Télécommande</span><span>Code ${esc(ROOM)}</span></div>
    <div class="ph-center"><h2>PIN de l'écran</h2><p class="muted">Ouvrez ⚙️ Réglages sur l'écran TV pour voir le PIN (ou scannez le QR code de la télécommande).</p>
    ${err?`<p class="warn">${err}</p>`:''}
    <form id="pf" class="ph-form"><input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off" required><button class="btn">Connecter</button></form></div></div>`;
  $("#pf").onsubmit = e => { e.preventDefault(); A.pin=$("#pin").value.replace(/\D/g,""); if(A.pin) aConnect(); };
}
function aWait(title, sub, actions){ A.view=""; app.innerHTML = `<div class="rm"><div class="ph-center"><div class="spin"></div><h2>${title}</h2><p class="muted">${sub||""}</p>${actions||""}</div></div>`; }
async function aConnect(){
  if(!peerOk()) return;
  clearTimeout(A.rt); aWait("Connexion à l'écran…", "Code "+esc(ROOM));
  try{ A.peer && A.peer.destroy(); }catch(e){}
  const peer = A.peer = await makePeer();
  peer.on("open", () => {
    const c = A.conn = peer.connect(PREFIX+ROOM, {reliable:true});
    c.on("open", () => c.send({t:"admin", pin:A.pin}));
    c.on("data", aData);
    c.on("close", () => { if(A.conn===c) aLost(); });
    c.on("error", () => { if(A.conn===c) aLost(); });
  });
  peer.on("disconnected", () => { try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
  peer.on("error", e => { if(A.peer!==peer) return;
    if(e.type==="peer-unavailable"){ aWait("Écran introuvable", `Lancez l'écran TV puis réessayez (code ${esc(ROOM)}).`, `<button class="btn" id="rt">Réessayer</button>`); $("#rt").onclick=aConnect; A.rt=setTimeout(aConnect, 5000); }
    else aLost(); });
}
function aLost(){ clearTimeout(A.rt); aWait("Reconnexion…", "L'écran TV est peut-être en train de redémarrer"); A.rt=setTimeout(aConnect, 2500); }
document.addEventListener("visibilitychange", () => { if(params.has("admin") && ROOM && document.visibilityState==="visible" && !(A.conn && A.conn.open) && A.pin) aConnect(); });
const aSend = m => { try{ A.conn.send(m); }catch(e){ toast("Écran non joignable"); aLost(); } };
function aData(d){
  if(!d || typeof d!=="object") return;
  if(d.t==="badpin"){ store.del("qb_apin_"+ROOM); A.pin=""; try{ A.peer.destroy(); }catch(e){} return aPinForm("PIN incorrect."); }
  if(d.t==="toast") return toast(d.msg);
  if(d.t!=="astate") return;
  store.set("qb_apin_"+ROOM, A.pin);
  A.st = d; if(d.phase==="question") A.endsAt = Date.now()+d.endsIn;
  renderRemote();
}

/* ===================== BANQUE DE QUESTIONS (onglets par catégorie) ===================== */
const normQ = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function bankView(cat){
  const all = bank(), counts = {}; all.forEach(q=>counts[q[0]]=(counts[q[0]]||0)+1);
  cat = CATS[cat] ? cat : Object.keys(CATS)[0];
  const list = all.filter(q=>q[0]===cat), quizzes = QZ.all();
  edShell(`📚 Banque de questions <small class="muted">${all.length}</small>`, `
    <div class="tabs" role="tablist">${Object.entries(CATS).map(([k,v])=>`<button role="tab" class="tab ${k===cat?'on':''}" data-t="${k}">${v} <small>${counts[k]||0}</small></button>`).join("")}</div>
    <div class="ed-actions"><label class="tg"><input type="checkbox" id="all"> Tout cocher</label><span style="flex:1"></span>
      <select id="dest" class="cat"><option value="">Copier vers…</option>${quizzes.map(z=>`<option value="${esc(z.id)}">${esc(z.name)}</option>`).join("")}<option value="new">+ Nouveau quiz</option></select>
      <button class="btn sm" id="copy" disabled>Copier (0)</button></div>
    <div class="ed-list">${list.map((x,i)=>`<label class="ed-q bq"><input type="checkbox" data-i="${i}"><span><span class="ed-qt">${esc(x[1])}</span><span class="ed-ans"><span class="good">✓ ${esc(x[2][0])}</span>${x[2].slice(1).map(a=>`<span>${esc(a)}</span>`).join("")}</span></span></label>`).join("")}</div>`, "Mes quiz");
  $("#back").onclick = editorHome;
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => bankView(b.dataset.t));
  const boxes = [...app.querySelectorAll(".bq input")];
  const upd = () => { const n=boxes.filter(b=>b.checked).length; $("#copy").textContent=`Copier (${n})`; $("#copy").disabled = !n || !$("#dest").value; };
  boxes.forEach(b=>b.onchange=upd); $("#dest").onchange=upd;
  $("#all").onchange = e => { boxes.forEach(b=>b.checked=e.target.checked); upd(); };
  $("#copy").onclick = () => {
    let z; if($("#dest").value==="new"){ const name=prompt("Nom du nouveau quiz ?", CATS[cat]); if(!name) return; z={id:rid(6), name:name.trim().slice(0,60)||CATS[cat], shuffle:true, qs:[]}; } else z=QZ.get($("#dest").value);
    if(!z) return;
    const have = new Set(z.qs.map(x=>normQ(x.q))); let added=0, dup=0;
    boxes.filter(b=>b.checked).forEach(b=>{ const x=list[+b.dataset.i]; if(have.has(normQ(x[1]))){ dup++; return; } have.add(normQ(x[1])); z.qs.push({c:CATS[cat], q:x[1], a:x[2].slice()}); added++; });
    QZ.put(z); toast(`${added} question(s) copiée(s) dans « ${z.name} »${dup?` · ${dup} doublon(s) ignoré(s)`:''}`); bankView(cat);
  };
}

const P = { peer:null, conn:null, pid:store.get("qb_pid_"+ROOM,null), name:store.get("qb_name",""), av:store.get("qb_av",null)||pick(AVATARS), col:store.get("qb_col",null)||pick(COLORS), st:null, endsAt:0, raf:0, joined:false, retry:0, kicked:false, everIn:false, openT:0, rt:0, busy:false };

function playerJoin(editing){

const BOTNAMES = ["Léa","Hugo","Chloé","Lucas","Manon","Nathan","Inès","Théo","Jade","Louis","Emma","Jules","Zoé","Noah","Lina","Tom"];
function waiting(title, sub, actions){
  app.innerHTML = `<div class="ph"><div class="ph-center"><div class="spin"></div><h2>${title}</h2><p>${sub||""}</p>${actions||""}</div></div>`;
}
async function connect(){
  if(!peerOk() || P.busy || P.kicked) return;
  P.busy = true; clearTimeout(P.rt); clearTimeout(P.openT);
  if(!P.everIn) waiting("Connexion…","On rejoint la partie");
  try{ if(P.conn) P.conn.close(); }catch(e){}
  const open = () => {
    const conn = P.conn = P.peer.connect(PREFIX+ROOM, {reliable:true});
    // si le canal ne s'ouvre pas, le réseau bloque probablement la connexion directe
    P.openT = setTimeout(() => { if(!conn.open && P.conn===conn){ P.busy=false; netBlocked(); } }, 15000);
    conn.on("open", () => { clearTimeout(P.openT); P.busy=false; P.retry=0; conn.send({t:"join", pid:P.pid, name:P.name, av:P.av, col:P.col, cgu:store.get("qb_cgu","")}); });
    conn.on("data", onPData);
    conn.on("close", () => { if(P.conn===conn) lost(); });
    conn.on("error", () => { if(P.conn===conn) lost(); });
  };
  if(P.peer && !P.peer.destroyed && P.peer.open){ open(); return; }
  try{ P.peer && P.peer.destroy(); }catch(e){}
  const peer = P.peer = await makePeer();
  peer.on("open", open);
  peer.on("disconnected", () => { try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
  peer.on("error", e => {
    if(P.peer!==peer) return;
    P.busy=false; clearTimeout(P.openT);
    if(e.type==="peer-unavailable"){
      if(P.everIn || BOT){ waiting(BOT?"En attente de l'écran TV…":"L'écran TV redémarre…","Reconnexion automatique, garde cette page ouverte"); P.rt=setTimeout(connect, BOT?1500:3000); }
      else { app.innerHTML = `<div class="ph"><div class="ph-center"><div class="big-emoji">🤔</div><h2>Partie introuvable</h2><p>Vérifie le code affiché sur l'écran TV.</p><button class="btn" onclick="location.search=''">Retour</button><button class="btn ghost" id="rt">Réessayer</button></div></div>`; $("#rt").onclick=connect; }
    } else lost();
  });
}
function netBlocked(){
  waiting("Connexion bloquée", "Le réseau de ton téléphone bloque la connexion. Essaie de passer du Wi-Fi à la 4G (ou l'inverse), puis réessaie.", `<button class="btn" id="rt">Réessayer</button>`);
  $("#rt").onclick = () => { try{ P.peer.destroy(); }catch(e){} P.peer=null; connect(); };
}
function lost(){
  if(P.kicked || !P.joined) return;
  if(P.conn && P.conn.open) return;
  clearTimeout(P.rt); P.busy=false;
  waiting("Reconnexion…","Garde cette page ouverte");
  P.rt = setTimeout(connect, Math.min(1000*(1+P.retry++), 5000));
}
document.addEventListener("visibilitychange", () => {
  if(!ROOM || !P.joined || document.visibilityState!=="visible") return;
  keepAwake();
  if(!(P.conn && P.conn.open)) connect(); else try{ P.conn.send({t:"join", pid:P.pid, name:P.name, av:P.av, col:P.col, cgu:store.get("qb_cgu","")}); }catch(e){} // resynchronise l'état
});

function onPData(d){
  if(!d||typeof d!=="object") return;
  if(d.t==="kicked"){ P.kicked=true; store.set("qb_pid_"+ROOM,null); app.innerHTML=`<div class="ph"><div class="ph-center"><div class="big-emoji">🚪</div><h2>Tu as été retiré de la partie</h2></div></div>`; return; }
  if(d.t==="needcgu"){ P.joined=false; store.del("qb_cgu"); try{ P.conn.close(); }catch(e){} playerJoin(); toast("Merci d'accepter les conditions d'utilisation"); return; }
  if(d.t!=="state") return;
  P.everIn = true;
  if(d.pid && d.pid!==P.pid){ P.pid=d.pid; store.set("qb_pid_"+ROOM,d.pid); }
  const prev=P.st; P.st=d;
  if(d.phase==="question") P.endsAt = Date.now()+d.endsIn;
  if(d.phase==="reveal" && !(prev&&prev.phase==="reveal"&&prev.qi===d.qi) && navigator.vibrate) navigator.vibrate(d.mine===d.correct?[60,40,60]:200);
  renderPlayer();
}

    const ok = s.mine===s.correct, none = s.mine==null;
    app.innerHTML = `<div class="ph">${topBar()}<div class="ph-center">
      <div class="result ${none?'none':ok?'ok':'ko'}">
        <h2>${none?'⏰ Trop tard !':ok?'✓ Bonne réponse !':'✗ Raté !'}</h2>
        ${ok?`<div class="gain">+${s.gain} pts${s.streak>1?` · série ×${s.streak} 🔥`:''}</div>`:`<div class="corr">Réponse : <b>${esc(s.correctText)}</b></div>`}
      </div>
      <div class="stat"><div><b>${s.rank}<sup>${s.rank===1?'er':'e'}</sup></b><span>sur ${s.players}</span></div><div><b>${s.score}</b><span>points</span></div></div>
      <p>${s.phase==="leaderboard"?'Le classement est à l\'écran 👀':'Prochaine question bientôt…'}</p>
    </div></div>`;
  }
  else if(s.phase==="end"){
    const medal = ["🥇","🥈","🥉"][s.rank-1] || "🎉";
    app.innerHTML = `<div class="ph">${topBar()}<div class="ph-center">
      <div class="big-emoji">${medal}</div>${avHTML(s,"big")}
      <h2>${s.rank===1?'Champion·ne du bar !':`${s.rank}<sup>e</sup> place`}</h2>
      <div class="stat"><div><b>${s.score}</b><span>points</span></div><div><b>${s.rank}/${s.players}</b><span>classement</span></div></div>
      <p>Merci d'avoir joué ! Reste connecté pour la prochaine partie.</p>
    </div></div>`;
  }
}

/* ===================== DÉMARRAGE ===================== */
if(QS.has("admin") && ROOM) adminRemote(QS.get("admin"));
else if(ROOM) playerJoin();
else if(QS.get("edit")) editorHome();
else if(QS.has("host")) startHost(null);
else home();
</script>
</body>
</html>
