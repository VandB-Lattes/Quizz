<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1714">
<link rel="icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VandB Quizz">
<title>VandB Quizz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(!window.Peer)document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script>if(!window.Peer)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"><\/script>')</script>
<script src="config.js"></script>
<script>if(new URLSearchParams(location.search).has("mock"))document.write('<script src="mock-reseau.js"><\/script>')</script>
<script src="qrcode.min.js"></script>
<style>
:root{
  --bg:#1d1714; --bg2:#22303b; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --text:#fff7ef; --muted:#d9bfc6; --gold:#f7a325; --wine:#e8551f;
  --c0:#e2463f; --c1:#2f7de1; --c2:#e8a317; --c3:#2ea862;
  --ok:#2ea862; --ko:#e2463f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--bg)}
body{background:radial-gradient(120% 90% at 20% 0%,var(--bg2),var(--bg) 60%) fixed;color:var(--text);font-family:"Open Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
h1,h2,h3,.display{font-family:"Alegreya","Open Sans",sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select{font:inherit}
.btn{background:var(--gold);color:#1d1714;font-weight:700;padding:14px 22px;border-radius:14px;font-size:1.05rem;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}
#app{min-height:100%}

/* ---------- HOME ---------- */
.home{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.home-card{width:100%;max-width:520px;min-width:0;text-align:center}
.home h1{font-size:clamp(2.6rem,9vw,4.4rem);line-height:.95;margin:10px 0 14px}
.home h1 em{font-style:normal;color:var(--gold)}
.home p{color:var(--muted);margin-bottom:28px}
.home .stack{display:grid;gap:12px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;width:0;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700;font-size:1.2rem}
.sep{color:var(--muted);font-size:.85rem;margin:6px 0}
.kicker{text-transform:uppercase;letter-spacing:.25em;font-size:.78rem;color:var(--gold);font-weight:700}

/* ---------- TV ---------- */
.tv{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:3vh 4vw;gap:2.4vh;font-size:clamp(12px,min(1.55vw,2.75vh),48px)}
.tv-head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.tv-head h1{font-size:2.6em;line-height:1}
.tools{display:flex;gap:10px;align-items:center}
.tools button{font-size:.75em;padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.tools button.on{background:var(--gold);color:#1d1714;border-color:transparent}
.lobby-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:3vw;min-height:0}
.joincard{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:3vh 2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center}
.joincard .qr{background:#fff;padding:14px;border-radius:18px;line-height:0}
.joincard .qr img,.joincard .qr canvas{width:min(32vh,24vw)!important;height:auto!important}
.joincard{overflow:hidden;min-height:0}
.joincard .warn{font-size:.65em}
.joincard .code{font-size:1.1em;color:var(--muted)}
.joincard .code b{display:block;font-family:"Alegreya";font-size:3.2em;color:var(--gold);letter-spacing:.15em;line-height:1.05}
.joincard .url{font-size:.7em;color:var(--muted);word-break:break-all}
.players{display:flex;flex-direction:column;min-height:0}
.players h2{font-size:1.6em;margin-bottom:1.5vh}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow:auto}
.chip{background:var(--card);border:1px solid var(--line);padding:.45em .9em;border-radius:999px;font-weight:600;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.chip.off{opacity:.4}
.chip:hover{border-color:var(--ko)}
.empty{color:var(--muted)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.settings{display:flex;flex-wrap:wrap;gap:1.2vw;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.6vh 1.6vw;font-size:.8em}
.settings label{display:flex;align-items:center;gap:8px;color:var(--muted)}
.settings select,.settings input[type=text]{background:#2a211c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.cat{padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.95em}
.cat.on{background:var(--wine);color:#fff;border-color:transparent}
.settings .btn{margin-left:auto;font-size:1.2em;padding:.6em 1.4em}

.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--muted)}
.pill{background:var(--wine);color:#fff;padding:.3em .9em;border-radius:999px}
.answered b{color:var(--gold);font-size:1.4em}
.qtext{font-size:2.6em;line-height:1.12;text-align:center;flex:1;display:grid;place-items:center;padding:0 3vw;text-wrap:balance}
.timer{display:flex;align-items:center;gap:1.2vw}
.track{flex:1;height:14px;background:var(--card);border-radius:99px;overflow:hidden}
.bar{height:100%;background:var(--gold);border-radius:99px;width:100%;transform-origin:left}
.secs{font-family:"Alegreya";font-weight:800;font-size:2.2em;min-width:2.2ch;text-align:right}
.secs.hot{color:var(--ko)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 1.4vw}
.ch{position:relative;overflow:hidden;display:flex;align-items:center;gap:1vw;padding:2.4vh 1.6vw;border-radius:20px;font-weight:700;font-size:1.45em;min-height:12vh;transition:opacity .4s,transform .4s}
.ch .shape{font-size:1.1em;opacity:.9;flex:none}
.ch .lbl{position:relative;z-index:1;flex:1}
.ch .cnt{position:relative;z-index:1;font-family:"Alegreya";font-size:1.2em}
.ch .fill{position:absolute;inset:0;background:rgba(0,0,0,.18);transform-origin:left;transition:transform .8s}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.reveal .ch.wrong{opacity:.28;transform:scale(.97)}
.reveal .ch.right{box-shadow:0 0 0 6px #fff,0 0 50px rgba(255,255,255,.35);transform:scale(1.02)}
.reveal .ch.right::after{content:"✓";position:relative;z-index:1;font-size:1.4em}
.hint{text-align:center;color:var(--muted);font-size:.75em}
.next{align-self:center;font-size:1.1em}

.lb{flex:1;display:flex;flex-direction:column;gap:1.1vh;max-width:1100px;width:100%;margin:0 auto}
.lb h2{font-size:2.4em;text-align:center;margin-bottom:1vh}
.row{display:flex;align-items:center;gap:1.4vw;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2vh 1.6vw;font-size:1.3em;animation:slide .45s both}
.row .rk{font-family:"Alegreya";font-weight:800;width:2ch;color:var(--gold)}
.row .nm{flex:1;font-weight:700}
.row .gain{color:var(--ok);font-weight:700;font-size:.8em}
.row .sc{font-family:"Alegreya";font-weight:800}
@keyframes slide{from{opacity:0;transform:translateY(16px)}}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:2vw;flex:1;padding-bottom:2vh}
.step{display:flex;flex-direction:column;align-items:center;gap:1vh;width:18vw}
.step .who{font-weight:800;font-size:1.4em;text-align:center}
.step .pts{color:var(--muted)}
.step .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:2vh;font-family:"Alegreya";font-weight:800;font-size:3em;color:#1d1714;animation:rise .9s cubic-bezier(.2,1.2,.4,1) both}
.p1 .blk{height:34vh;background:var(--gold);animation-delay:.9s}
.p2 .blk{height:24vh;background:#d8d8e0;animation-delay:.45s}
.p3 .blk{height:17vh;background:#d58a4e}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}}

/* ---------- PHONE ---------- */
.ph{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.ph-top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--muted);font-size:.9rem;gap:8px}
.ph-top .me{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;color:var(--text);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 0}
.ph-center h2{font-size:2rem;line-height:1.1}
.ph-center p{color:var(--muted)}
.big-emoji{font-size:4.5rem;line-height:1}
.ph form{display:grid;gap:12px;width:100%}
.ph input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:16px;font-size:1.2rem;text-align:center}
.pq{font-weight:700;font-size:1.05rem;margin:12px 0;text-align:center;line-height:1.3}
.pchoices{flex:1;display:grid;grid-template-rows:repeat(4,1fr);gap:10px}
.pch{border-radius:18px;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;color:#fff;min-height:64px}
.pch .shape{font-size:1.5rem}
.ptime{font-family:"Alegreya";font-weight:800;font-size:1.3rem;color:var(--text)}
.result{width:100%;border-radius:24px;padding:28px 18px}
.result.ok{background:var(--ok)}.result.ko{background:var(--ko)}.result.none{background:var(--card);border:1px solid var(--line)}
.result h2{font-size:2.2rem}
.result .gain{font-family:"Alegreya";font-weight:800;font-size:1.6rem;margin-top:6px}
.result .corr{margin-top:10px;opacity:.95}
.stat{display:flex;gap:10px;width:100%}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:"Alegreya";font-size:1.7rem}
.stat span{color:var(--muted);font-size:.8rem}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:9}
.logo{display:block;max-width:100%;height:auto;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35))}
.home .logo{width:min(460px,100%);margin:0 auto 6px}
.tv-head .logo{height:11vh;width:auto}
.ph .logo{width:min(300px,80%);margin:0 auto}
.warn{background:#5a1a10;border:1px solid #e2463f;border-radius:12px;padding:10px 14px;font-size:.75em;color:#ffd9cf}

.net{font-size:.7em;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.net.ok::before{content:"● ";color:var(--ok)}.net.bad::before{content:"● ";color:var(--ko)}
.banner{position:fixed;top:0;left:0;right:0;background:var(--ko);color:#fff;text-align:center;padding:8px;font-weight:700;z-index:20}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:30;padding:16px}
.modal-box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(900px,100%);max-height:92vh;display:flex;flex-direction:column;gap:12px;font-size:15px}
.modal-box h3{font-size:1.4rem}
.modal-box p,.modal-box li{color:var(--muted);font-size:.9rem}
.modal-box code{background:#0006;padding:2px 6px;border-radius:6px;color:var(--text)}
.modal-box textarea{flex:1;min-height:260px;background:#14100e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,monospace;resize:vertical}
.modal-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ed{max-width:760px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.ed-top{display:flex;justify-content:space-between;align-items:center}
.ed h2{font-size:1.7rem}
.logo.mini{width:110px}
.btn.sm{padding:8px 14px;font-size:.9rem;text-decoration:none}
.muted{color:var(--muted);font-size:.92rem}
.ed-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ed-actions.sticky{position:sticky;bottom:0;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.ed-list{display:flex;flex-direction:column;gap:10px}
.ed-item{display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:1.05rem}
.ed-item small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.ed-title{width:100%;background:transparent;border:0;border-bottom:2px dashed var(--line);color:var(--text);font:inherit;padding:4px 0}
.ed-q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ed-qh{display:flex;justify-content:space-between;align-items:center}
.pill.sm{font-size:.78rem;padding:3px 10px}
.ed-qt{font-weight:700}
.ed-ans{display:flex;flex-wrap:wrap;gap:6px}
.ed-ans span{font-size:.85rem;padding:4px 10px;border-radius:99px;background:#0003;color:var(--muted)}
.ed-ans span.good{background:var(--ok);color:#fff;font-weight:700}
.ed-qa{display:flex;gap:6px;flex-wrap:wrap}
.ed-qa button{padding:6px 12px;border-radius:10px;background:#0003;border:1px solid var(--line);font-size:.85rem}
.ed-qa button:disabled{opacity:.3}
.danger{color:#ff9b7a!important}
.ed-form{display:flex;flex-direction:column;gap:12px}
.ed-form>label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.ed-form input,.ed-form textarea{background:#14100e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:1rem}
.ed-a{display:flex;align-items:center;gap:10px;border-radius:14px;padding:8px 10px}
.ed-a input:not([type=radio]){flex:1;min-width:0;border:0}
.ed-a .ok{display:flex;align-items:center;gap:4px;font-size:.85rem;font-weight:700;color:#fff;white-space:nowrap}
.ed-a .ok input{width:20px;height:20px;accent-color:#fff}
.tg{display:flex;gap:8px;align-items:center;color:var(--muted)}
@media (pointer:coarse){ .tools button,.cat{padding:10px 16px} .settings select,.settings input[type=text]{padding:10px 12px} .settings input[type=checkbox]{width:22px;height:22px} }
@media (max-aspect-ratio:1/1){ .lobby-grid{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)} .joincard .qr img,.joincard .qr canvas{width:min(26vh,50vw)!important} .tv{font-size:clamp(12px,min(2.4vw,2vh),40px)} .step{width:28vw} }
.is-fs #fs{display:none}
body.idle,body.idle *{cursor:none!important}
.av{display:inline-grid;place-items:center;flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--pc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);line-height:1}
.av.sm{width:1.6em;height:1.6em;font-size:.95em}
.av.big{width:2.2em;height:2.2em;font-size:2.2rem}
.av.huge{width:2em;height:2em;font-size:3.6rem}
.chip{display:inline-flex;align-items:center;gap:.45em;border-color:var(--pc,var(--line));padding-left:.35em}
.row{border-left:6px solid var(--pc,var(--line))}
.row .av{font-size:.9em}
.step .av.big{font-size:2.4em}
.ph-top .me{display:inline-flex;align-items:center;gap:6px;border-color:var(--pc,var(--line));padding-left:4px}
.join form{gap:10px}
.ph-center.join{justify-content:flex-start;gap:10px;padding-top:6px}
.join .logo{width:min(170px,50%)}
.join .avb{font-size:1.35rem;border-radius:10px}
.me-prev{display:flex;align-items:center;gap:12px;font-family:"Alegreya";font-weight:800;font-size:1.5rem}
.pick-lbl{text-align:left;color:var(--muted);font-size:.85rem;font-weight:600;margin-top:4px}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avb{aspect-ratio:1;font-size:1.5rem;border-radius:12px;background:var(--card);border:2px solid transparent}
.avb.on{border-color:var(--gold);background:rgba(246,194,28,.18)}
.colrow{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.colb{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.colb.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.gear{opacity:.35}.gear:hover{opacity:1}
.ctl{font:inherit;font-size:.75em;padding:.5em 1.1em;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);opacity:.55;align-self:center}
.ctl:hover{opacity:1}
.lobby-foot{display:flex;justify-content:space-between;gap:20px;font-size:.8em}
.modal-box.wide{width:min(1000px,100%);overflow:auto}
.modal-box h3 small{font-size:.8rem;font-weight:400}
.set-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media (max-width:760px){.set-grid{grid-template-columns:1fr}}
.sform{display:flex;flex-direction:column;gap:10px}
.sform>label,.srow>label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.85rem;font-weight:600}
.sform>label.tg{flex-direction:row;font-size:.95rem}
.sform input[type=text],.sform select{background:#14100e;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:1rem}
.sform input[type=checkbox]{width:20px;height:20px}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scats{display:flex;flex-wrap:wrap;gap:6px}
.scats[hidden]{display:none}
.remote-card{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:#0003;border-radius:16px;padding:16px}
.qr.sm{background:#fff;padding:10px;border-radius:12px;line-height:0}
.pin{font-size:1.4rem;color:var(--gold);letter-spacing:.15em}
.cgu{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:.9rem;color:var(--muted)}
.cgu input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--gold)}
.cgu a,.ed a:not(.btn),#app p.muted a:not(.btn){color:var(--gold);text-decoration:underline;text-underline-offset:2px}
.rm{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px}
.rm .ph-center{min-height:70vh}
.rm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard h3{font-size:1.1rem}
.rpl{display:flex;flex-direction:column;gap:6px}
.rp{display:flex;align-items:center;gap:10px;background:#0003;border-left:5px solid var(--pc);border-radius:12px;padding:8px 10px;font-weight:600}
.rp.off{opacity:.45}.rp .nm{flex:1}.rp .sc{font-family:"Alegreya";font-weight:800}
.rp .x{width:34px;height:34px;border-radius:10px;background:#0004;color:#ff9b7a}
.rq{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Réseau : STUN + relais TURN optionnel */
let ICE = null, HAS_TURN = false;
async function getIce(){
  if(ICE) return ICE;
  const base = [{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{urls:"stun:stun.cloudflare.com:3478"}];
  ICE = base;
  if(CONFIG.RELAIS_PUBLIC !== false && !MOCK){ ICE = base.concat([PUBLIC_TURN]); HAS_TURN = true; }
  if(CONFIG.TURN_API_URL && !MOCK){
    try{
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 6000);
      const r = await fetch(CONFIG.TURN_API_URL, {signal:ctl.signal}); clearTimeout(t);
      const j = await r.json();
      if(Array.isArray(j) && j.length){ ICE = ICE.concat(j); HAS_TURN = true; }
    }catch(e){}
  }
  return ICE;
}
async function makePeer(id){
  const opts = Object.assign({debug:0, config:{iceServers: await getIce()}}, CONFIG.PEER_SERVER||{});
  return id ? new Peer(id, opts) : new Peer(opts);
}

async function startHost(resume, mode){
  setTimeout(() => { if(GH.token() && (store.get("qb_gh_bad",false) || ((GH.expDays() ?? 99) <= 30))) toast(store.get("qb_gh_bad",false) ? "☁️ Jeton GitHub expiré : Mes quiz → Coller un nouveau jeton (rien n'est perdu)" : `☁️ Le jeton GitHub expire dans ${Math.max(0,GH.expDays())} jour(s) : pensez à le renouveler`); }, 2500);
  if(!peerOk()) return;
  H.mode = mode || (resume && resume.mode) || "regie";
  keepAwake();
  if(TVCH) TVCH.onmessage = e => { if(e.data && e.data.t==="hello") pushDisplay(); };
  syncQuizzes(); SEASON.sync();
  app.innerHTML = `<div class="home"><div class="home-card ph-center"><div class="spin"></div><p id="st">Préparation de la connexion…</p></div></div>`;
  await getIce();
  let tries = 0, want = resume ? resume.code : (MOCK && QS.get("code")) ? QS.get("code").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4) : null;
  const tryOpen = async () => {
    H.code = want || Array.from({length:4},()=> "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.random()*24|0]).join("");
    const peer = await makePeer(PREFIX + H.code);
    peer.on("open", () => {
      H.peer = peer; H.online = true; setNet(); banner(null);
      if(resume){ const r=resume; resume=null; restore(r); } else renderHost();
    });
    peer.on("error", e => {
      if(e.type==="unavailable-id"){
        try{ peer.destroy(); }catch(_){}
        if(want){
          // après un rechargement, le serveur garde l'ancien code quelques instants
          if(++tries <= 40){ const st=$("#st"); if(st) st.textContent=`Récupération du code ${want}… (${tries}/40)`; setTimeout(tryOpen, 3000); }
          else { want=null; toast("Ancien code indisponible : nouveau code, les joueurs doivent rescanner"); tryOpen(); }
        } else tryOpen();
      }
      else if(["network","server-error","socket-error","socket-closed"].includes(e.type)){ H.online=false; setNet(); banner("Connexion au serveur perdue — reconnexion…"); setTimeout(()=>{ try{ if(peer.destroyed){ want=H.code; tryOpen(); } else if(peer.disconnected) peer.reconnect(); }catch(_){} }, 2500); }
    });
    peer.on("disconnected", () => { H.online=false; setNet(); banner("Connexion au serveur perdue — reconnexion…"); setTimeout(()=>{ try{ if(!peer.destroyed && peer.disconnected) peer.reconnect(); }catch(e){} }, 1500); });
    peer.on("connection", conn => {
      conn.on("data", d => hostData(conn, d));
      conn.on("close", () => { const p = conn.pid && H.players.get(conn.pid); if(p && p.conn===conn){ p.connected=false; onRosterChange(); } });
      conn.on("error", () => {});
    });
  };
  tryOpen();
  if(!startHost._bound){
    startHost._bound = true;
    document.addEventListener("keydown", e => {
      if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || $(".modal")) return;
      if(e.code==="Space"||e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); advance(); }
      if((e.key==="r"||e.key==="R") && H.mode==="ecran") openHostSettings();
    });
    document.addEventListener("visibilitychange", keepAwake);
    window.addEventListener("storage", e => { if(/qb_settings$/.test(e.key||"")) H.settings = Object.assign({}, DEFAULTS, store.get("qb_settings", {})); if(/qb_quizzes|qb_season$|qb_settings$/.test(e.key||"") && !$(".modal")){ A.qsig=""; renderHost(); } });
    window.addEventListener("beforeunload", e => { if(H.phase!=="lobby"){ saveGame(); e.preventDefault(); e.returnValue=""; } });
  }
}

function restore(sv){
  H.phase = sv.phase; H.qs = sv.qs||[]; H.src = sv.src||""; H.gid = sv.gid||""; H.seasonDone = sv.seasonDone||""; H.qi = sv.qi; H.answers = new Map(sv.answers||[]); H.lastGain = new Map(sv.lastGain||[]);

function buildPool(){
  const s = H.settings, z = s.quiz!=="builtin" ? QZ.get(s.quiz) : null;

  const th = new Set(themesOf(s));
  return shuffle(bank().filter(q => th.has(q[0]+"/"+q[1])).map(x => Object.assign(bankQ(x), {alc:ALC_THEMES.includes(x[0]+"/"+x[1])||isAlc({q:x[2],a:x[3]})})));
}
function startGame(){
  const pool = buildPool();
  if(!pool.length){ toast("Aucune question : choisis des catégories ou un quiz qui contient des questions"); return; }
  const zq = H.settings.quiz!=="builtin" ? QZ.get(H.settings.quiz) : null; H.src = (zq && zq.source) || "";
  H.qs = pool.slice(0, H.settings.n || pool.length).map(({c,q,a,info,alc,yt,ys,yd,yt2}) => {
    const order = shuffle(a.map((_,i)=>i));
    const it = {c, q, info, alc: alc || isAlc({q,a}), choices:order.map(i=>a[i]), correct:order.indexOf(0)};
    return withYt(it, {yt,ys,yd,yt2});
  });
  H.players.forEach(p => { p.score=0; p.streak=0; p.nAns=0; p.nOk=0; p.maxStreak=0; p.season=null; });

}

  clearTimers();

  H.phase="question"; H.answers.clear(); H.lastGain.clear(); H.qStart = Date.now(); H.ytN = 0;
  broadcast(); renderHost(); saveGame(); startSaveLoop();
  H.timeout = setTimeout(reveal, H.settings.time*1000 + 300);

function reveal(){
  if(H.phase!=="question") return;
  clearTimers();
  const q = H.qs[H.qi], limit = H.settings.time*1000;
  H.players.forEach(p => {
    const a = H.answers.get(p.pid);
    if(a) p.nAns = (p.nAns||0) + 1;
    if(a && a.choice===q.correct){
      p.streak++; p.nOk = (p.nOk||0) + 1; p.maxStreak = Math.max(p.maxStreak||0, p.streak);
      const g = Math.round(500 + 500*Math.max(0, 1 - a.t/limit)) + Math.min(p.streak-1,3)*50;
      p.score += g; H.lastGain.set(p.pid, g);

function splitCSV(line, sep){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"' && !cur.trim()) q=true; else if(ch===sep){ out.push(cur); cur=""; } else cur+=ch; }
  out.push(cur); return out.map(x=>x.trim());
}
function parseCSV(txt){
  const ok=[], bad=[], seen=new Set();
  const lines = String(txt).replace(/^\uFEFF/,"").split(/\r?\n/);
  const first = lines.find(l=>l.trim())||"";
  const sep = first.includes(";") ? ";" : first.includes("\t") ? "\t" : ",";
  lines.forEach((line,i)=>{
    if(!line.trim() || /^\s*"?cat[ée]gorie"?\s*[;\t,]/i.test(line)) return;
    const f=splitCSV(line, sep);
    const ans=f.slice(2,6).filter(Boolean);
    if(f.length>=4 && f[1] && f[2] && ans.length>=2){ const k=normQ(f[1])+"|"+normQ(f[2]); if(seen.has(k)) return; seen.add(k);
      const y = f[6] ? ytParse(f[6]) : null; if(f[6] && !y){ bad.push(i+1); return; }
      const ys = f[7] ? ytSecs(f[7]) : (y ? y.s : 0);
      ok.push([f[0]||"Quiz", f[1], ans, y ? {yt:y.id, ys:isNaN(ys)?0:ys, yd:15} : null]); } else bad.push(i+1);
  });
  return {ok,bad};
}
/* ===================== BLIND TEST (extraits YouTube) =====================
   L'extrait est joué par la régie (ou par l'écran en mode écran unique). Les téléphones des joueurs ne reçoivent
   jamais le lien YouTube. Rien n'est hébergé sur le site. */
function ytSecs(v){
  v = String(v==null?"":v).trim(); if(!v) return 0; if(/^\d+$/.test(v)) return +v;
  let m = v.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/); if(m) return m[3]!=null ? (+m[1])*3600+(+m[2])*60+(+m[3]) : (+m[1])*60+(+m[2]);
  m = v.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/); if(m && (m[1]||m[2]||m[3])) return (+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0);
  return NaN;
}
function ytParse(s){
  s = String(s||"").trim(); if(!s) return null;
  const m = s.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  const id = m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(s) ? s : null); if(!id) return null;
  const t = s.match(/[?&#](?:t|start)=([0-9hms:]+)/); const sec = t ? ytSecs(t[1]) : 0;
  return {id, s: isNaN(sec) ? 0 : sec};
}
const fmtSecs = n => `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
const ytUrl = (id, s) => `https://www.youtube.com/watch?v=${id}${s?`&t=${s}s`:""}`;
function ytClean(x){ const id = String((x&&x.yt)||""); if(!/^[A-Za-z0-9_-]{11}$/.test(id)) return null;
  const o = {yt:id, ys:Math.max(0, Math.min(36000, parseInt(x.ys)||0)), yd: +x.yd===10 ? 10 : 15};
  if(/^[A-Za-z0-9_-]{11}$/.test(String(x.yt2||"")) && x.yt2!==id) o.yt2 = x.yt2; return o; }
const withYt = (item, x) => { const y = ytClean(x); return y ? Object.assign(item, y) : item; };

/* Import des fichiers JSON d'OpenQuizzDB (openquizzdb.org, licence CC BY-SA 4.0) */
const OQDB_SOURCE = "OpenQuizzDB (openquizzdb.org) · CC BY-SA 4.0";
function parseOQDB(o, fname){
  if(!o || typeof o!=="object") return null;
  const meta = o["catégorie-nom-slogan"] || o["categorie-nom-slogan"] || {};
  const m = meta.fr || Object.values(meta)[0] || {};
  const name = m.nom || m.name || o.nom || fname || "Quiz OpenQuizzDB";
  const cat = m["catégorie"] || m.categorie || m.category || name;
  let root = o.quizz || o.quiz || o;
  if(root && root.fr) root = root.fr;
  const out = [], seen = new Set();
  (function walk(n, lvl){
    if(Array.isArray(n)) return n.forEach(x=>walk(x, lvl));
    if(!n || typeof n!=="object") return;
    const props = n.propositions || n.choix || n.answers;
    if(typeof n.question==="string" && Array.isArray(props)){
      const p = props.map(v=>String(v).trim()).filter(Boolean);
      const rep = n["réponse"] ?? n.reponse ?? n.answer;
      const good = typeof rep==="number" ? p[rep] : String(rep||"").trim();
      const gi = p.findIndex(v=>normQ(v)===normQ(good));
      const k = normQ(n.question);
      if(gi>=0 && p.length>=2 && !seen.has(k)){
        seen.add(k);
        const y = {c:String(cat).slice(0,40), q:n.question.trim().slice(0,300), a:[p[gi], ...p.filter((_,i)=>i!==gi)].slice(0,4).map(v=>v.slice(0,120))};
        if(n.anecdote) y.info = String(n.anecdote).trim().slice(0,400);
        out.push(y);
      }
      return;
    }
    for(const [key,v] of Object.entries(n)) walk(v, key);
  })(root, "");
  return out.length ? {id:rid(6), name:String(name).slice(0,60), shuffle:true, qs:out, source:OQDB_SOURCE} : null;
}

const qKey = x => normQ(x.q)+"|"+normQ((x.a||[])[0]||"");
let _subs = null;
function subsOf(cat){
  if(!_subs){ _subs = {}; bank().forEach(q => { (_subs[q[0]] = _subs[q[0]] || {}); _subs[q[0]][q[1]] = (_subs[q[0]][q[1]]||0) + 1; }); }
  return _subs[cat] || {};
}
/* Loi Évin : thèmes liés à l'alcool décochés par défaut, message sanitaire affiché avec chaque question qui en parle */
const EVIN = "L'abus d'alcool est dangereux pour la santé, à consommer avec modération.";
const ALC_THEMES = ["vin/Vins & vignobles","vin/Bières & spiritueux","vin/Cocktails & apéro"];
const ALC_RE = /\b(vins?|bières?|alcool(s|is[ée]e?s?)?|whiske?y|vodka|gin|tequila|cocktails?|champagnes?|liqueurs?|apéritifs?|spiritueux|cognac|armagnac|calvados|pastis|absinthe|sak[ée]|cépages?|vignobles?|brass(er|erie|é)|houblon|ivre|ivresse|kir|mojito|spritz|cidre|eau-de-vie)\b/i;

const ALL_THEMES = () => Object.keys(CATS).flatMap(k => Object.keys(subsOf(k)).map(s => k+"/"+s));
const bankLabel = (k, sub) => CATS[k]+" · "+sub;
function themesOf(s){ const t = Array.isArray(s.themes) && s.themes.length ? s.themes : (s.cats||Object.keys(CATS)).flatMap(k => Object.keys(subsOf(k)).map(x => k+"/"+x)).filter(x => !ALC_THEMES.includes(x) && !isBlindTheme(x)); const ok = new Set(ALL_THEMES()); const r = t.filter(x => ok.has(x)); return r.length ? r : ALL_THEMES(); }
function themeSummary(sel){
  const all = ALL_THEMES(); if(sel.size >= all.length) return "Tous les thèmes";
  const cats = Object.keys(CATS).filter(k => Object.keys(subsOf(k)).some(s => sel.has(k+"/"+s)));

}
function bindThemePicker(root, sel, onChange){
  const refresh = () => {
    root.querySelectorAll(".tp-cat").forEach(div => { const c = div.querySelector(".tp-c"), k = c.dataset.c, subs = Object.keys(subsOf(k)), n = subs.filter(s => sel.has(k+"/"+s)).length;
      c.classList.toggle("on", n===subs.length); c.classList.toggle("part", n>0 && n<subs.length);

    if(onChange) onChange();
  };

  root.querySelectorAll(".chip-s").forEach(b => b.onclick = () => { const key=b.dataset.s; sel.has(key) ? sel.delete(key) : sel.add(key); refresh(); });
}
/* tirage équilibré entre les sous-catégories choisies */
function bankPick(themes, n, exclude){
  const groups = {}; bank().forEach(q => { const t=q[0]+"/"+q[1]; if(themes.includes(t) && !exclude.has(normQ(q[2])+"|"+normQ(q[3][0]))) (groups[t]=groups[t]||[]).push(q); });
  const lists = shuffle(Object.values(groups)).map(l => shuffle(l)), out = [];
  while(out.length < n && lists.some(l => l.length)) lists.forEach(l => { if(l.length && out.length < n) out.push(l.pop()); });
  return out.map(bankQ);
}

}

/* ===================== SAUVEGARDE EN LIGNE (dépôt GitHub du site) ===================== */
const XK = "vandb-quizz";
function xorBytes(u){ for(let i=0;i<u.length;i++) u[i]^=XK.charCodeAt(i%XK.length); return u; }
function b64FromBytes(u){ let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); }
function bytesFromB64(b){ const s=atob(b.replace(/\s/g,"")), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
const encData = o => b64FromBytes(xorBytes(new TextEncoder().encode(JSON.stringify(o))));
const decData = s => JSON.parse(new TextDecoder().decode(xorBytes(bytesFromB64(s))));
const b64Utf8 = s => b64FromBytes(new TextEncoder().encode(s));
const utf8B64 = b => new TextDecoder().decode(bytesFromB64(b));
async function sha(s){ const h=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }

const GH = {
  repo(){
    const c = CONFIG.GITHUB || {};
    if(c.owner && c.repo) return {owner:c.owner, repo:c.repo, branch:c.branch||"main"};
    const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i); if(!m) return null;
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return {owner:m[1], repo:(seg && !/\.html?$/i.test(seg)) ? seg : m[1]+".github.io", branch:c.branch||"main"};
  },
  token(){ return store.get("qb_gh_token","") },
  ready(){ return !!(this.repo() && this.token()) },
  api(path){ const r=this.repo(); return `https://api.github.com/repos/${r.owner}/${r.repo}${path}`; },
  hdr(){ return {Authorization:"Bearer "+this.token(), Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"}; },
  // date d'expiration du jeton (en-tête renvoyé par GitHub) + jeton expiré / révoqué
  watch(res){
    try{ const x = res.headers.get("github-authentication-token-expiration"); if(x){ const d = Date.parse(x.replace(" UTC","Z").replace(" ","T")); if(d){ store.set("qb_gh_exp", d); store.set("qb_gh_exp_hdr", true); } } }catch(e){}
    if(res.status===401){ store.set("qb_gh_bad", true); const e=new Error("jeton GitHub expiré ou révoqué"); e.auth=true; throw e; }
    return res;
  },
  expDays(){ const d = store.get("qb_gh_exp", 0); return d ? Math.floor((d-Date.now())/864e5) : null; },
  async check(tok){
    const r=this.repo(); if(!r) throw new Error("adresse du site non reconnue (le site doit être ouvert depuis github.io)");
    const res = await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}`, {headers:{Authorization:"Bearer "+tok, Accept:"application/vnd.github+json"}});
    if(res.status===401) throw new Error("jeton refusé (copié en entier ? expiré ?)");
    store.del("qb_gh_exp"); store.del("qb_gh_exp_hdr"); store.del("qb_gh_bad");
    try{ const x = res.headers.get("github-authentication-token-expiration"); if(x){ const d = Date.parse(x.replace(" UTC","Z").replace(" ","T")); if(d){ store.set("qb_gh_exp", d); store.set("qb_gh_exp_hdr", true); } } }catch(e){}
    if(res.status===404) throw new Error(`dépôt ${r.owner}/${r.repo} introuvable avec ce jeton (accès au dépôt non donné ?)`);
    if(!res.ok) throw new Error("GitHub répond "+res.status);
    const j = await res.json(); if(j.permissions && !j.permissions.push) throw new Error("ce jeton ne peut pas écrire (permission Contents : Read and write)");
    return true;
  },
  async get(path){
    const res = this.watch(await fetch(this.api(`/contents/${path}?ref=${this.repo().branch}&t=${Date.now()}`), {headers:this.hdr(), cache:"no-store"}));
    if(res.status===404) return {sha:null, text:null};
    if(!res.ok) throw new Error("lecture GitHub "+res.status);
    const j = await res.json(); return {sha:j.sha, text:utf8B64(j.content||"")};
  },
  async put(path, text, sha, message){
    const body = {message, content:b64Utf8(text), branch:this.repo().branch}; if(sha) body.sha = sha;
    const res = this.watch(await fetch(this.api(`/contents/${path}`), {method:"PUT", headers:Object.assign({"Content-Type":"application/json"}, this.hdr()), body:JSON.stringify(body)}));
    store.del("qb_gh_bad");
    if(res.status===409 || res.status===422) { const e=new Error("conflit"); e.conflict=true; throw e; }
    if(!res.ok) throw new Error("écriture GitHub "+res.status);
    return (await res.json()).content.sha;
  },
  async readJSON(path){
    // lecture : par l'API si l'appareil est connecté ; sinon par l'API publique (à jour immédiatement), puis le site public en secours
    if(this.ready()){ const g = await this.get(path); return {sha:g.sha, data:g.text ? JSON.parse(g.text) : null}; }
    const r = this.repo();
    if(r) try{
      const res = await fetch(`https://api.github.com/repos/${r.owner}/${r.repo}/contents/${path}?ref=${r.branch}&t=${Date.now()}`, {headers:{Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
      if(res.status===404) return {sha:null, data:null};
      if(res.ok) return {sha:null, data:await res.json(), live:true};
    }catch(e){}
    const res = await fetch(path+"?t="+Date.now(), {cache:"no-store"});
    if(!res.ok) return {sha:null, data:null};
    try{ return {sha:null, data:await res.json()}; }catch(e){ return {sha:null, data:null}; }
  },
  async writeJSON(path, merge, message){
    // lit → fusionne → écrit ; recommence une fois en cas d'écriture simultanée
    for(let i=0;i<3;i++){
      const g = await this.get(path); const cur = g.text ? JSON.parse(g.text) : null;
      const next = merge(cur); if(!next) return cur;
      try{ await this.put(path, JSON.stringify(next), g.sha, message); return next; }catch(e){ if(!e.conflict || i===2) throw e; }
    }
  }
};
const CLOUD = {status:"", at:0, busy:false,
  set(s){ this.status=s; this.at=Date.now(); const el=$("#cloudst"); if(el){ el.innerHTML=cloudBadge(); bindCloud(el); } },
};
function cloudBadge(){
  if(!GH.repo()) return `<span class="muted">☁️ Sauvegarde en ligne disponible une fois le site publié sur GitHub</span>`;
  if(!GH.token()) return `<span class="warn-t">☁️ Sauvegarde en ligne non connectée sur cet appareil</span> <button class="btn ghost sm" data-gh>Connecter</button>`;
  const t = CLOUD.at ? new Date(CLOUD.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "";

/* ---- quiz : fusion locale / en ligne ---- */
const QPATH = "data/quiz.json";
function mergeQuizLists(a, b){
  const del = {}; [...(a.deleted||[]), ...(b.deleted||[])].forEach(d => { if(!del[d.id] || del[d.id] < d.at) del[d.id]=d.at; });
  const map = {}; [...(a.quizzes||[]), ...(b.quizzes||[])].forEach(z => { if(!map[z.id] || (map[z.id].updated||0) < (z.updated||0)) map[z.id]=z; });
  const quizzes = Object.values(map).filter(z => !(del[z.id] && del[z.id] >= (z.updated||0)));
  return {quizzes, deleted:Object.entries(del).map(([id,at])=>({id,at})).filter(d=>Date.now()-d.at < 400*864e5)};
}
let syncT=0;
function scheduleSync(){ clearTimeout(syncT); syncT = setTimeout(()=>syncQuizzes(), 1500); }
async function syncQuizzes(force){
  if(MOCK || CLOUD.busy || !GH.repo()) return;
  const local = {quizzes:QZ.all(), deleted:store.get("qb_quiz_deleted", [])};
  try{
    CLOUD.busy = true; if(GH.ready()) CLOUD.set("busy");
    let merged;
    if(GH.ready()){
      merged = null;
      await GH.writeJSON(QPATH, cur => {
        const remote = cur && cur.enc ? decData(cur.enc) : {quizzes:[], deleted:[]};
        merged = mergeQuizLists(remote, local);
        if(cur && JSON.stringify(mergeQuizLists(remote,{})) === JSON.stringify(merged) && !force) return null;
        return {app:"vandb-quizz", v:1, info:"Quiz chiffrés de VandB Quizz — ne pas modifier à la main", maj:Date.now(), enc:encData(merged)};
      }, "Sauvegarde des quiz");
      CLOUD.set("ok");
    } else {
      const {data} = await GH.readJSON(QPATH);
      if(!data || !data.enc) { CLOUD.busy=false; return; }
      merged = mergeQuizLists(decData(data.enc), local);
    }
    if(merged){ store.set("qb_quizzes", merged.quizzes); store.set("qb_quiz_deleted", merged.deleted); }
    CLOUD.busy = false;
    if(typeof refreshAfterSync === "function") refreshAfterSync();
  }catch(e){ CLOUD.busy=false; if(GH.ready()) CLOUD.set("err"); }
}

/* ===================== SAISON (classement annuel, bonus / malus) ===================== */
const SPATH = "data/saison.json";
const BAREME_DEFAUT = {rangs:[25,18,15,12,10,8,6,4,2,1], participation:5, sansFaute:10, serie5:5, abandon:-5};
function newSeason(nom){ const y=new Date().getFullYear(), m=new Date().getMonth(); return {v:1, nom: nom || `Saison ${m>=8?y:y-1}-${m>=8?y+1:y}`, debut:new Date().toISOString().slice(0,10), cree:Date.now(), bareme:Object.assign({},BAREME_DEFAUT), joueurs:{}, mv:[], parties:[]}; }
function mergeSeason(a, b){
  if(!a) return b; if(!b) return a;
  if((a.cree||0) !== (b.cree||0) || a.nom !== b.nom) return (a.cree||0) >= (b.cree||0) ? a : b;   // nouvelle saison : la plus récente gagne
  const out = Object.assign({}, a, {bareme: (b.baremeAt||0) > (a.baremeAt||0) ? b.bareme : a.bareme, baremeAt: Math.max(a.baremeAt||0, b.baremeAt||0)});
  const gone = new Set([...(a.oublies||[]), ...(b.oublies||[])]);
  const mv = {}; [...a.mv, ...b.mv].forEach(x => { if(!gone.has(x.h)) mv[x.id]=x; });
  out.mv = Object.values(mv).sort((x,y)=>x.d-y.d).slice(-8000);
  const pt = {}; [...(a.parties||[]), ...(b.parties||[])].forEach(x => pt[x.id]=x); out.parties = Object.values(pt).sort((x,y)=>x.d-y.d).slice(-300);
  out.joueurs = {}; [a.joueurs, b.joueurs].forEach(J => Object.entries(J||{}).forEach(([h,j]) => { if(!gone.has(h) && (!out.joueurs[h] || (out.joueurs[h].at||0) < (j.at||0))) out.joueurs[h]=j; }));
  out.oublies = [...gone];
  return out;
}
const SEASON = {
  data(){ let s = store.get("qb_season", null); if(!s){ s = newSeason(); store.set("qb_season", s); } return s; },
  save(s){ store.set("qb_season", s); this.dirty(); },
  _t:0, dirty(){ store.set("qb_season_dirty", true); clearTimeout(this._t); this._t = setTimeout(()=>this.sync(), 1200); },
  async sync(){
    if(MOCK || !GH.repo()) return;
    try{
      if(GH.ready()){
        const local = this.data(); let merged=null;
        await GH.writeJSON(SPATH, cur => { merged = mergeSeason(cur, local); if(cur && !store.get("qb_season_dirty",false) && JSON.stringify(cur)===JSON.stringify(merged)) return null; merged.maj=Date.now(); return merged; }, "Classement de la saison");
        if(merged) store.set("qb_season", merged); store.set("qb_season_dirty", false); CLOUD.set("ok");
      } else {
        const {data} = await GH.readJSON(SPATH); if(data && data.mv) store.set("qb_season", mergeSeason(data, store.get("qb_season_dirty",false) ? this.data() : null) || data);
      }
      if(typeof H!=="undefined" && H.code){ pushDisplay(); sendAdmins(); }
    }catch(e){ if(GH.ready()) CLOUD.set("err"); }
  },
  mv(s, h, p, r, g){ s.mv.push({id:rid(8), d:Date.now(), h, p:Math.round(p), r:String(r).slice(0,80), g:g||""}); },
  meet(s, h, p){ s.joueurs[h] = {n:p.name, av:p.av, c:p.col, at:Date.now()}; }
};
function seasonTable(s){
  s = s || SEASON.data(); const t = {};
  Object.entries(s.joueurs||{}).forEach(([h,j]) => t[h] = {h, n:j.n, av:j.av, c:j.c, pts:0, parties:0, victoires:0});
  s.mv.forEach(x => { const r=t[x.h]; if(!r) return; r.pts += x.p; if(x.r.startsWith("Partie")) r.parties++; if(/^Partie · 1er/.test(x.r)) r.victoires++; });
  const arr = Object.values(t).filter(r=>r.parties || r.pts).sort((a,b)=>b.pts-a.pts || b.victoires-a.victoires);
  let rank=0, prev=null; arr.forEach((r,i)=>{ if(r.pts!==prev){ rank=i+1; prev=r.pts; } r.rank=rank; });
  return arr;
}
/* fin de partie : points de saison pour chaque joueur */
function applySeason(){
  if(!H.settings.season || H.seasonDone===H.gid || !H.gid) return;
  H.seasonDone = H.gid;
  const s = SEASON.data(), b = s.bareme, r = ranking(), quiz = quizInfo().split(" · ")[0], nQ = H.qs.length;
  const before = Object.fromEntries(seasonTable(s).map(x=>[x.h,x.rank]));
  const deltas = {};
  r.forEach(p => {
    if(!p.hid || !p.nAns) return;   // n'a répondu à rien : ne compte pas
    SEASON.meet(s, p.hid, p);
    const add = (pts, why) => { if(!pts) return; SEASON.mv(s, p.hid, pts, why, H.gid); deltas[p.pid] = (deltas[p.pid]||0) + pts; };
    const rp = b.rangs[p.rank-1] || 0;
    add(rp || 0.0001, `Partie · ${p.rank}${p.rank===1?"er":"e"} sur ${r.length} · ${quiz}`);
    add(b.participation, "Bonus participation");
    if(nQ>=5 && p.nOk===nQ) add(b.sansFaute, "Bonus sans faute");
    if(p.maxStreak>=5) add(b.serie5, "Bonus série de 5 bonnes réponses");
    if(!p.connected) add(b.abandon, "Malus abandon en cours de partie");
  });
  s.parties.push({id:H.gid, d:Date.now(), quiz, n:r.length, top:r.slice(0,3).map(p=>({n:p.name, s:p.score}))});
  SEASON.save(s);
  const after = Object.fromEntries(seasonTable(s).map(x=>[x.h,x]));
  H.players.forEach(p => { if(p.hid && after[p.hid]) p.season = {pts:after[p.hid].pts, rank:after[p.hid].rank, delta:Math.round(deltas[p.pid]||0), before:before[p.hid]||null}; });
}
function seasonOf(hid){ if(!hid) return null; const t=seasonTable().find(x=>x.h===hid); return t ? {pts:t.pts, rank:t.rank, total:seasonTable().length} : null; }
function seasonAdmin(d){
  const s = SEASON.data();
  if(d.op==="bonus"){
    const h=String(d.h||""), p=Math.max(-1000, Math.min(1000, Math.round(+d.p||0))); if(!p || !s.joueurs[h]) return;
    SEASON.mv(s, h, p, (p>0?"Bonus":"Malus")+" · "+(String(d.r||"").trim().slice(0,60)||"animateur")); SEASON.save(s);
  }
  else if(d.op==="bareme" && d.v){ const v=d.v, n=x=>Math.max(-100,Math.min(100,Math.round(+x||0)));
    s.bareme = {rangs:(Array.isArray(v.rangs)?v.rangs:[]).slice(0,20).map(n), participation:n(v.participation), sansFaute:n(v.sansFaute), serie5:n(v.serie5), abandon:n(v.abandon)}; s.baremeAt=Date.now(); SEASON.save(s); }
  else if(d.op==="forget"){ const h=String(d.h||""); delete s.joueurs[h]; s.mv=s.mv.filter(x=>x.h!==h); s.oublies=[...(s.oublies||[]), h]; SEASON.save(s); }
  else if(d.op==="new"){ const old=s; const ns=newSeason(String(d.nom||"").trim().slice(0,40)||undefined);
    if(ns.nom===old.nom) ns.nom += " (2)"; ns.bareme = old.bareme;
    if(GH.ready()) GH.writeJSON(`data/archives/${slug(old.nom)}.json`, () => old, "Archive "+old.nom).catch(()=>{});
    store.set("qb_season", ns); SEASON.dirty(); }
  else if(d.op==="show"){ H.view = H.view==="season" ? "" : "season"; }
  pushDisplay(); sendAdmins(); broadcast();
}

function adminData(conn, d){
  if(d.t==="admin"){
    if(String(d.pin)===H.pin){ conn.admin=true; H.admins.add(conn); conn.on("close",()=>H.admins.delete(conn)); try{ conn.send(adminState()); }catch(e){} }
    else { try{ conn.send({t:"badpin"}); }catch(e){} }
    return true;
  }
  if(!conn.admin) return false;
  if(d.t==="set") applySetting(d.k, d.v);
  else if(d.t==="season") seasonAdmin(d);
  else if(d.t==="cmd"){
    if(d.c==="start" && H.phase==="lobby") startGame();
    else if(d.c==="advance") advance();
    else if((d.c==="lobby" && H.phase==="end") || (d.c==="stop" && H.phase!=="lobby")){ const m=$(".modal"); if(m) m.remove(); backToLobby(); }
    else if(d.c==="kick") kickPlayer(String(d.pid));

    const z=cleanQuiz(d.quiz); const id=String(d.quiz.id||"").replace(/[^a-z0-9]/gi,"").slice(0,12);

  return true;
}

async function aConnect(){
  if(!peerOk()) return;
  clearTimeout(A.rt); aWait("Connexion à l'écran…", "Code "+esc(ROOM));
  try{ A.peer && A.peer.destroy(); }catch(e){}
  const peer = A.peer = await makePeer();
  peer.on("open", () => {
    const c = A.conn = peer.connect(PREFIX+ROOM, {reliable:true});
    c.on("open", () => c.send({t:"admin", pin:A.pin}));
    c.on("data", aData);
    c.on("close", () => { if(A.conn===c) aLost(); });
    c.on("error", () => { if(A.conn===c) aLost(); });
  });
  peer.on("disconnected", () => { try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
  peer.on("error", e => { if(A.peer!==peer) return;
    if(e.type==="peer-unavailable"){ aWait("Écran introuvable", `Lancez l'écran TV puis réessayez (code ${esc(ROOM)}).`, `<button class="btn" id="rt">Réessayer</button>`); $("#rt").onclick=aConnect; A.rt=setTimeout(aConnect, 5000); }
    else aLost(); });
}
function aLost(){ clearTimeout(A.rt); aWait("Reconnexion…", "L'écran TV est peut-être en train de redémarrer"); A.rt=setTimeout(aConnect, 2500); }

           : `<p class="muted">${uid ? "Tu n'as pas encore de points cette saison : joue une partie pour entrer dans le classement !" : "Joue une partie pour entrer dans le classement."}</p>`}
      ${uid ? `<div class="uidcard">🔑 Ton code joueur : <b>${fmtUid(uid)}</b><small>Note-le : sur un autre téléphone, saisis-le à l'inscription (« J'ai déjà un code joueur ») pour retrouver tes points.</small></div>` : ''}
      ${hist.length ? `<h3>Mes points</h3><div class="hist">${hist.map(x=>`<div><span>${new Date(x.d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})}</span><span>${esc(x.r)}</span><b class="${x.p<0?'neg':''}">${fmtPts(x.p)}</b></div>`).join("")}</div>` : ''}
      <h3>Classement</h3>
      <div class="rpl">${table && table.length ? table.slice(0,100).map(x=>`<div class="rp ${x.h===hid?'me':''}" style="--pc:${okCol(x.c)}"><b class="rk2">${x.rank}</b>${avHTML({av:x.av,col:x.c},"sm")}<span class="nm">${esc(x.n)}</span><span class="sc">${x.pts}</span></div>`).join("") : '<p class="muted">Le classement n\'est pas encore disponible.</p>'}</div>
    </div></div>`;
  $("#bk").onclick = () => fromGame && P.st ? renderPlayer() : home();
  if($("#rf")) $("#rf").onclick = () => seasonPage(fromGame);
}

/* ===================== BANQUE DE QUESTIONS (onglets par catégorie) ===================== */
const normQ = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function bankView(cat, sub, dest){
  const all = bank(), counts = {}; all.forEach(q=>counts[q[0]]=(counts[q[0]]||0)+1);
  cat = CATS[cat] ? cat : Object.keys(CATS)[0];
  const subs = subsOf(cat); if(sub && !subs[sub]) sub = null;
  const list = all.filter(q=>q[0]===cat && (!sub || q[1]===sub)), quizzes = QZ.all(), dz = dest ? QZ.get(dest) : null;
  const have = new Set(dz ? dz.qs.map(qKey) : []);
  edShell(`📚 Banque de questions <small class="muted">${all.length}</small>`, `
    ${dz?`<p class="anec">Ajout dans « ${esc(dz.name)} » : cochez des questions puis touchez <b>Ajouter</b>.</p>`:''}
    <div class="tabs" role="tablist">${Object.entries(CATS).filter(([k])=>counts[k]).map(([k,v])=>`<button role="tab" class="tab ${k===cat?'on':''}" data-t="${k}">${esc(v)} <small>${counts[k]||0}</small></button>`).join("")}</div>
    <div class="subtabs"><button class="chip-s ${!sub?'on':''}" data-sub="">Toutes <small>${Object.values(subs).reduce((a,b)=>a+b,0)}</small></button>${Object.entries(subs).map(([s,c])=>`<button class="chip-s ${s===sub?'on':''}" data-sub="${esc(s)}">${esc(s)} <small>${c}</small></button>`).join("")}</div>
    <div class="ed-actions"><label class="tg"><input type="checkbox" id="all"> Tout cocher</label><span style="flex:1"></span>
      ${dz?'':`<select id="dest" class="cat"><option value="">Copier vers…</option>${quizzes.map(z=>`<option value="${esc(z.id)}">${esc(z.name)}</option>`).join("")}<option value="new">+ Nouveau quiz</option></select>`}
      <button class="btn sm" id="copy" disabled>${dz?'Ajouter':'Copier'} (0)</button></div>
    <div class="ed-list">${list.map((x,i)=>{ const inQ = have.has(normQ(x[2])+"|"+normQ(x[3][0])); return `<label class="ed-q bq ${inQ?'inq':''}"><input type="checkbox" data-i="${i}" ${inQ?'disabled':''}><span><span class="pill sm">${esc(x[1])}</span><span class="ed-qt">${esc(x[2])}</span><span class="ed-ans"><span class="good">✓ ${esc(x[3][0])}</span>${x[3].slice(1).map(a=>`<span>${esc(a)}</span>`).join("")}</span>${inQ?'<small class="ok-t">déjà dans le quiz</small>':''}</span></label>`; }).join("")}</div>`, dz ? dz.name.slice(0,24) : "Mes quiz");
  $("#back").onclick = () => dz ? editQuiz(dz.id) : editorHome();
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => bankView(b.dataset.t, null, dest));
  app.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => bankView(cat, b.dataset.sub || null, dest));
  const boxes = [...app.querySelectorAll(".bq input:not([disabled])")];
  const upd = () => { const n=boxes.filter(b=>b.checked).length; $("#copy").textContent=`${dz?'Ajouter':'Copier'} (${n})`; $("#copy").disabled = !n || (!dz && !$("#dest").value); };
  boxes.forEach(b=>b.onchange=upd); if($("#dest")) $("#dest").onchange=upd;
  $("#all").onchange = e => { boxes.forEach(b=>b.checked=e.target.checked); upd(); };
  $("#copy").onclick = () => {
    let z = dz;
    if(!z){ if($("#dest").value==="new"){ const name=prompt("Nom du nouveau quiz ?", sub || CATS[cat]); if(!name) return; z={id:rid(6), name:name.trim().slice(0,60)||CATS[cat], shuffle:true, qs:[]}; } else z=QZ.get($("#dest").value); }
    if(!z) return;
    const keys = new Set(z.qs.map(qKey)); let added=0, dup=0;
    boxes.filter(b=>b.checked).forEach(b=>{ const x=list[+b.dataset.i], item=bankQ(x); if(keys.has(qKey(item))){ dup++; return; } keys.add(qKey(item)); z.qs.push(item); added++; });
    QZ.put(z); toast(`${added} question(s) ajoutée(s) à « ${z.name} »${dup?` · ${dup} déjà présente(s)`:''}`);
    dz ? editQuiz(z.id) : bankView(cat, sub, null);
  };
}

/* ===================== JOUEUR (TÉLÉPHONE) ===================== */
const P = { peer:null, conn:null, pid:store.get("qb_pid_"+ROOM,null), name:store.get("qb_name",""), av:okAv(store.get("qb_av",null)||pick(AVATARS)), col:store.get("qb_col",null)||pick(COLORS), st:null, endsAt:0, raf:0, joined:false, retry:0, kicked:false, everIn:false, openT:0, rt:0, busy:false };

function playerJoin(editing){
  app.innerHTML = `<div class="ph">
    <div class="ph-top"><span class="kicker">VandB Quizz</span><span>Code ${esc(ROOM)}</span></div>
    <div class="ph-center join">
      ${editing?'':'<img class="logo" src="logo.png" alt="VandB Quizz">'}
      <div class="me-prev" id="prev"></div>
      <form id="f">
        <label class="pick-lbl" for="nm">Ton nom de joueur</label>
        <input type="text" id="nm" maxlength="16" placeholder="Ton nom" value="${esc(P.name)}" autocomplete="off" required>
        <div class="pick-lbl">Ton avatar</div>
        <div class="avgrid" id="avs">${AVATARS.map(a=>`<button type="button" class="avb ${a===okAv(P.av)?'on':''}" data-a="${a}" aria-label="${esc(AVSVG[a][0])}" title="${esc(AVSVG[a][0])}" style="--pc:${okCol(P.col)}">${avSvg(a)}</button>`).join("")}</div>
        <div class="pick-lbl">Ta couleur</div>
        <div class="colrow" id="cols">${COLORS.map(c=>`<button type="button" class="colb ${c===P.col?'on':''}" data-c="${c}" style="background:${c}" aria-label="Couleur"></button>`).join("")}</div>
        ${editing?'':`<details class="uidbox" ${myUid(false)?'':''}><summary>🔑 J'ai déjà un code joueur</summary><input id="uidin" maxlength="9" placeholder="ABCD-1234" autocomplete="off" value="${esc(fmtUid(myUid(false)))}"><small>Pour retrouver tes points de saison sur ce téléphone.</small></details>`}
        ${editing?'':`<label class="cgu"><input type="checkbox" id="cgu" ${store.get("qb_cgu","")===CGU_VERSION?'checked':''} required> <span>J'ai lu et j'accepte les <a href="conditions.html" target="_blank">conditions d'utilisation</a></span></label>`}
        <button class="btn">${editing?'Enregistrer':'C\'est parti !'}</button>
        ${editing?'<button type="button" class="btn ghost" id="cancel">Annuler</button>':''}
      </form>
      <p class="legal">${EVIN}</p>
    </div></div>`;
  const prev = () => { $("#prev").innerHTML = `${avHTML({av:P.av,col:P.col},"big")}<span>${esc($("#nm").value.trim()||"Ton nom")}</span>`; };
  prev(); $("#nm").oninput = prev;
  app.querySelectorAll(".avb").forEach(b => b.onclick = () => { P.av=b.dataset.a; app.querySelectorAll(".avb").forEach(x=>x.classList.toggle("on",x===b)); prev(); });
  app.querySelectorAll(".colb").forEach(b => b.onclick = () => { P.col=b.dataset.c; app.querySelectorAll(".colb").forEach(x=>x.classList.toggle("on",x===b)); app.querySelectorAll(".avb").forEach(x=>x.style.setProperty("--pc",P.col)); prev(); });
  if(editing) $("#cancel").onclick = () => renderPlayer();
  $("#f").onsubmit = e => {
    e.preventDefault(); const n=$("#nm").value.trim(); if(!n) return;
    if(!editing){ if(!$("#cgu").checked){ toast("Merci d'accepter les conditions d'utilisation"); return; } store.set("qb_cgu", CGU_VERSION);
      const u = ($("#uidin").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
      if(u){ if(u.length!==8 || [...u].some(ch=>!UIDABC.includes(ch))){ toast("Code joueur invalide (8 caractères, ex. ABCD-1234)"); return; } store.set("qb_uid", u); } }
    P.name=n; store.set("qb_name",n); store.set("qb_av",P.av); store.set("qb_col",P.col); P.joined=true; keepAwake();
    if(P.conn && P.conn.open) P.conn.send({t:"join", pid:P.pid, name:P.name, av:P.av, col:P.col, cgu:store.get("qb_cgu",""), uid:myUid(true)}); else connect();
  };
  if(!editing && BOT){ if(!P.name || !store.get("qb_name","")){ $("#nm").value = pick(BOTNAMES); } $("#cgu").checked=true; setTimeout(()=>$("#f").requestSubmit(), 300); return; }
  if(!editing && P.pid && P.name && store.get("qb_cgu","")===CGU_VERSION){ P.joined=true; connect(); }
}
const BOTNAMES = ["Léa","Hugo","Chloé","Lucas","Manon","Nathan","Inès","Théo","Jade","Louis","Emma","Jules","Zoé","Noah","Lina","Tom"];
function waiting(title, sub, actions){
  app.innerHTML = `<div class="ph"><div class="ph-center"><div class="spin"></div><h2>${title}</h2><p>${sub||""}</p>${actions||""}</div></div>`;
}
async function connect(){
  if(!peerOk() || P.busy || P.kicked) return;
  P.busy = true; clearTimeout(P.rt); clearTimeout(P.openT);
  if(!P.everIn) waiting("Connexion…","On rejoint la partie");
  try{ if(P.conn) P.conn.close(); }catch(e){}
  const open = () => {
    const conn = P.conn = P.peer.connect(PREFIX+ROOM, {reliable:true});
    // si le canal ne s'ouvre pas, le réseau bloque probablement la connexion directe
    P.openT = setTimeout(() => { if(!conn.open && P.conn===conn){ P.busy=false; netBlocked(); } }, 15000);
    conn.on("open", () => { clearTimeout(P.openT); P.busy=false; P.retry=0; conn.send({t:"join", pid:P.pid, name:P.name, av:P.av, col:P.col, cgu:store.get("qb_cgu",""), uid:myUid(true)}); });
    conn.on("data", onPData);
    conn.on("close", () => { if(P.conn===conn) lost(); });
    conn.on("error", () => { if(P.conn===conn) lost(); });
  };
  if(P.peer && !P.peer.destroyed && P.peer.open){ open(); return; }
  try{ P.peer && P.peer.destroy(); }catch(e){}
  const peer = P.peer = await makePeer();
  peer.on("open", open);
  peer.on("disconnected", () => { try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
  peer.on("error", e => {
    if(P.peer!==peer) return;
    P.busy=false; clearTimeout(P.openT);
    if(e.type==="peer-unavailable"){
      if(P.everIn || BOT){ waiting(BOT?"En attente de l'écran TV…":"L'écran TV redémarre…","Reconnexion automatique, garde cette page ouverte"); P.rt=setTimeout(connect, BOT?1500:3000); }
      else { app.innerHTML = `<div class="ph"><div class="ph-center"><div class="big-emoji">🤔</div><h2>Partie introuvable</h2><p>Vérifie le code affiché sur l'écran TV.</p><button class="btn" onclick="location.search=''">Retour</button><button class="btn ghost" id="rt">Réessayer</button></div></div>`; $("#rt").onclick=connect; }
    } else lost();
  });
}
function netBlocked(){
  waiting("Connexion bloquée", "Le réseau de ton téléphone bloque la connexion. Essaie de passer du Wi-Fi à la 4G (ou l'inverse), puis réessaie.", `<button class="btn" id="rt">Réessayer</button>`);
  $("#rt").onclick = () => { try{ P.peer.destroy(); }catch(e){} P.peer=null; connect(); };
}
function lost(){
  if(P.kicked || !P.joined) return;
  if(P.conn && P.conn.open) return;
  clearTimeout(P.rt); P.busy=false;
  waiting("Reconnexion…","Garde cette page ouverte");
  P.rt = setTimeout(connect, Math.min(1000*(1+P.retry++), 5000));
}
document.addEventListener("visibilitychange", () => {
  if(!ROOM || !P.joined || document.visibilityState!=="visible") return;
  keepAwake();
  if(!(P.conn && P.conn.open)) connect(); else try{ P.conn.send({t:"join", pid:P.pid, name:P.name, av:P.av, col:P.col, cgu:store.get("qb_cgu",""), uid:myUid(true)}); }catch(e){} // resynchronise l'état
});

function onPData(d){
  if(!d||typeof d!=="object") return;
  if(d.t==="kicked"){ P.kicked=true; store.set("qb_pid_"+ROOM,null); app.innerHTML=`<div class="ph"><div class="ph-center"><div class="big-emoji">🚪</div><h2>Tu as été retiré de la partie</h2></div></div>`; return; }
  if(d.t==="season"){ if(P.onSeason){ P.onSeason(d); P.onSeason=null; } return; }
  if(d.t==="needcgu"){ P.joined=false; store.del("qb_cgu"); try{ P.conn.close(); }catch(e){} playerJoin(); toast("Merci d'accepter les conditions d'utilisation"); return; }
  if(d.t!=="state") return;
  P.everIn = true;
  if(d.pid && d.pid!==P.pid){ P.pid=d.pid; store.set("qb_pid_"+ROOM,d.pid); }
  const prev=P.st; P.st=d;
  if(d.phase==="question") P.endsAt = Date.now()+d.endsIn;
  if(d.phase==="reveal" && !(prev&&prev.phase==="reveal"&&prev.qi===d.qi) && navigator.vibrate) navigator.vibrate(d.mine===d.correct?[60,40,60]:200);
  renderPlayer();
}
function topBar(extra){ const s=P.st; return `<div class="ph-top"><span class="me" style="--pc:${okCol(s.col)}">${avHTML(s,"sm")}${esc(s.name)}</span>${extra||`<span>${s.score} pts</span>`}</div>`; }
function renderPlayer(){
  cancelAnimationFrame(P.raf);
  const s=P.st;
  if(s.phase==="lobby"){
    app.innerHTML = `<div class="ph">${topBar(`<span>${esc(s.bar)}</span>`)}<div class="ph-center">${avHTML(s,"huge")}<h2>Tu es dans la partie !</h2><p>${s.players} joueur${s.players>1?'s':''} connecté${s.players>1?'s':''}.<br>Regarde l'écran, ça commence bientôt.</p>
      ${s.season ? `<p class="sline">🏆 Saison : <b>${s.season.rank}<sup>${s.season.rank===1?'er':'e'}</sup></b> · ${s.season.pts} pts</p>` : ''}
      <div class="ed-actions" style="justify-content:center"><button class="btn ghost" id="chg">Changer d'avatar</button><button class="btn ghost" id="ssn">🏆 Classement de la saison</button></div></div></div>`;
    $("#chg").onclick = () => playerJoin(true); $("#ssn").onclick = () => seasonPage(true);
  }
  else if(s.phase==="question"){
    if(s.answered!=null){
      app.innerHTML = `<div class="ph">${topBar(`<span class="ptime" id="pt"></span>`)}<div class="ph-center"><div class="pch c${s.answered}" style="width:100%;justify-content:center"><span class="shape">${SHAPES[s.answered]}</span>${esc(s.choices[s.answered])}</div><h2>Réponse envoyée</h2><p>Suspense… on attend les autres.</p></div></div>`;
    } else {
      app.innerHTML = `<div class="ph">${topBar(`<span class="ptime" id="pt"></span>`)}
        <div class="pq"><span class="kicker">${esc(s.cat)} · ${s.qi+1}/${s.total}</span><br>${s.text?esc(s.text):s.blind?'<span class="lookq">🎵 Écoute l\'extrait…</span>':'<span class="lookq">👀 Lis la question sur l\'écran</span>'}${s.alc?`<small class="evin">${EVIN}</small>`:''}</div>
        <div class="pchoices" style="grid-template-rows:repeat(${s.choices.length},1fr)">${s.choices.map((c,i)=>`<button class="pch c${i}" data-i="${i}"><span class="shape">${SHAPES[i]}</span>${esc(c)}</button>`).join("")}</div></div>`;
      app.querySelectorAll(".pch").forEach(b => b.onclick = () => {
        const i=+b.dataset.i; app.querySelectorAll(".pch").forEach(x=>x.disabled=true); b.style.outline="4px solid #fff";
        try{ P.conn.send({t:"answer", qi:s.qi, choice:i}); }catch(e){ toast("Envoi impossible, reconnexion…"); lost(); }
        if(navigator.vibrate) navigator.vibrate(30);
      });
      if(AUTO && P.autoQ!==s.qi){ P.autoQ=s.qi; const btns=[...app.querySelectorAll(".pch")]; setTimeout(()=>{ const b=pick(btns); if(b && b.isConnected && !b.disabled) b.click(); }, 1200+Math.random()*Math.max(1000, s.endsIn*0.6)); }
    }
    const pt=$("#pt"); const tick=()=>{ const left=Math.max(0,P.endsAt-Date.now()); if(pt) pt.textContent=Math.ceil(left/1000)+" s"; if(left>0) P.raf=requestAnimationFrame(tick); }; tick();
  }
  else if(s.phase==="reveal"||s.phase==="leaderboard"){
    const ok = s.mine===s.correct, none = s.mine==null;
    app.innerHTML = `<div class="ph">${topBar()}<div class="ph-center">
      <div class="result ${none?'none':ok?'ok':'ko'}">
        <h2>${none?'⏰ Trop tard !':ok?'✓ Bonne réponse !':'✗ Raté !'}</h2>
        ${ok?`<div class="gain">+${s.gain} pts${s.streak>1?` · série ×${s.streak} 🔥`:''}</div>`:`<div class="corr">Réponse : <b>${esc(s.correctText)}</b></div>`}
      </div>
      <div class="stat"><div><b>${s.rank}<sup>${s.rank===1?'er':'e'}</sup></b><span>sur ${s.players}</span></div><div><b>${s.score}</b><span>points</span></div></div>
      <p>${s.phase==="leaderboard"?'Le classement est à l\'écran 👀':'Prochaine question bientôt…'}</p>
    </div></div>`;
  }
  else if(s.phase==="end"){
    setTimeout(()=>{ const b=$("#ssn"); if(b) b.onclick=()=>seasonPage(true); });
    const medal = ["🥇","🥈","🥉"][s.rank-1] || "🎉";
    app.innerHTML = `<div class="ph">${topBar()}<div class="ph-center">
      <div class="big-emoji">${medal}</div>${avHTML(s,"big")}
      <h2>${s.rank===1?'Champion·ne du bar !':`${s.rank}<sup>e</sup> place`}</h2>
      <div class="stat"><div><b>${s.score}</b><span>points</span></div><div><b>${s.rank}/${s.players}</b><span>classement</span></div></div>
      ${s.season && s.season.delta!=null ? `<div class="sres"><b>${fmtPts(s.season.delta)} pts</b> de saison<span>${s.season.rank}<sup>${s.season.rank===1?'er':'e'}</sup> au classement · ${s.season.pts} pts</span></div>` : ''}
      <button class="btn ghost" id="ssn">🏆 Classement de la saison</button>
      <p>Merci d'avoir joué ! Reste connecté pour la prochaine partie.</p>
    </div></div>`;
  }
}

/* ===================== DÉMARRAGE ===================== */
if(QS.has("admin") && ROOM) adminRemote(QS.get("admin"));
else if(ROOM) playerJoin();
else if(QS.get("edit")) editorHome();
else if(QS.has("ecran")) displayWindow();
else if(QS.has("host")) startHost(null, "ecran");
else home();
</script>
