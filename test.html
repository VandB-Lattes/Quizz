<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151e25">
<link rel="icon" href="logo.png">
<title>Test de connexion · VandB Quizz</title>
<script src="config.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>if(!window.Peer)document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<style>
:root{--bg:#151e25;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#fff7ef;--muted:#c9c2bd;--gold:#f7a325;--ok:#2ea862;--ko:#e2463f;--warn:#e8a317}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 60px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:14px}
.logo{width:130px}
h1{font-size:1.5rem;line-height:1.2}
p{color:var(--muted)}
.sum{border-radius:16px;padding:16px;font-weight:700;font-size:1.1rem;background:var(--card);border:1px solid var(--line)}
.sum.ok{background:rgba(46,168,98,.18);border-color:var(--ok)}
.sum.warn{background:rgba(232,163,23,.15);border-color:var(--warn)}
.sum.ko{background:rgba(226,70,63,.18);border-color:var(--ko)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:32px 1fr;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ic{font-size:1.2rem;line-height:1.4;text-align:center}
.row b{display:block}
.row small{color:var(--muted);display:block}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{background:var(--gold);color:#151e25;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;text-decoration:none;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
  <div class="top"><img class="logo" src="logo.png" alt=""><div><h1>Test de connexion</h1><p>À ouvrir sur l'écran TV, puis sur un téléphone en Wi-Fi et en 4G.</p></div></div>
  <div class="sum" id="sum"><span class="spin"></span> Test en cours…</div>
  <div class="list" id="list"></div>
  <div class="btns"><button class="btn" id="again">Relancer le test</button><a class="btn ghost" href="simulateur.html">📱 Simulateur de joueurs</a><a class="btn ghost" href="./">← Retour au jeu</a></div>
</main>
<script>
const CFG = Object.assign({TURN_API_URL:"", PEER_SERVER:null, ORGANISATEUR:{}}, window.QB_CONFIG||{});
const list = document.getElementById("list"), sum = document.getElementById("sum");
const ICON = {ok:"✅", warn:"⚠️", ko:"❌", run:"⏳"};
const results = [];
function row(title){ const el=document.createElement("div"); el.className="row"; el.innerHTML=`<span class="ic">${ICON.run}</span><div><b></b><small>En cours…</small></div>`; el.querySelector("b").textContent=title; list.appendChild(el);
  return (state, msg) => { el.querySelector(".ic").textContent=ICON[state]; el.querySelector("small").textContent=msg; results.push(state); }; }
const wait = (ms) => new Promise(r=>setTimeout(r,ms));
const timeout = (p, ms, label) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error(label||"délai dépassé")), ms))]);
const STUN = [{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{urls:"stun:stun.cloudflare.com:3478"}];

async function fileOk(path){ try{ const r=await fetch(path,{cache:"no-store"}); return r.ok; }catch(e){ return false; } }

async function run(){
  list.innerHTML=""; results.length=0;
  sum.className="sum"; sum.innerHTML='<span class="spin"></span> Test en cours…';

  // 1. Navigateur
  let r=row("Navigateur");
  const ua=navigator.userAgent, br = /Edg\//.test(ua)?"Edge":/OPR\//.test(ua)?"Opera":/Chrome\//.test(ua)?"Chrome":/Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":"Autre";
  let store=true; try{ localStorage.setItem("qb_t","1"); localStorage.removeItem("qb_t"); }catch(e){ store=false; }
  if(!window.isSecureContext && location.protocol!=="file:") r("ko", `${br} — la page n'est pas en https. Ouvrez l'adresse github.io.`);
  else if(location.protocol==="file:") r("ko", `${br} — page ouverte depuis un fichier local : ouvrez l'adresse en ligne (github.io).`);
  else if(!store) r("warn", `${br} — stockage bloqué (navigation privée ?) : la reconnexion automatique ne marchera pas.`);
  else if(!window.RTCPeerConnection) r("ko", `${br} — ce navigateur ne gère pas les connexions directes (WebRTC). Utilisez Chrome, Edge ou Safari à jour.`);
  else r("ok", `${br} — compatible.`);

  // 2. Fichiers du site
  r=row("Fichiers du site");
  const files=["index.html","logo.png","qrcode.min.js","config.js","conditions.html"]; const missing=[];
  for(const f of files) if(!(await fileOk(f))) missing.push(f);
  missing.length ? r("ko", "Manquant(s) sur GitHub : "+missing.join(", ")) : r("ok", "Tous les fichiers sont en ligne.");

  // 3. Organisateur
  r=row("Conditions d'utilisation");
  const o=CFG.ORGANISATEUR||{}; (o.nom&&o.contact) ? r("ok", `Organisateur : ${o.nom}`) : r("warn", "Nom et contact de l'organisateur à compléter dans config.js.");

  // 4. Bibliothèque réseau
  r=row("Bibliothèque réseau (PeerJS)");
  if(!window.Peer){ r("ko","Impossible de la charger : connexion internet bloquée ou filtrée."); return finish(); }
  r("ok","Chargée.");

  // 5. Relais TURN
  r=row("Relais TURN (4G, Wi-Fi isolé)");
  let ice = STUN.slice(), turn=false;
  if(!CFG.TURN_API_URL) r("warn","Non configuré. Certains téléphones risquent de ne pas pouvoir se connecter. Voir config.js.");
  else{
    try{
      const res = await timeout(fetch(CFG.TURN_API_URL), 8000, "le service ne répond pas");
      const j = await res.json(); if(!Array.isArray(j) || !j.length) throw new Error("clé invalide ou quota épuisé");
      ice = ice.concat(j);
      await timeout(relayLoop(j), 12000, "le relais ne répond pas");
      turn=true; r("ok","Relais configuré et fonctionnel.");
    }catch(e){ r("ko","Relais configuré mais en échec : "+e.message+". Vérifiez l'URL dans config.js."); }
  }

  // 6. Serveur de mise en relation + connexion directe
  r=row("Serveur de mise en relation");
  const r2=row("Connexion entre deux appareils");
  const opts = Object.assign({debug:0, config:{iceServers:ice}}, CFG.PEER_SERVER||{});
  let a,b;
  try{
    const t0=performance.now();
    a = new Peer(opts); await timeout(new Promise((res,rej)=>{ a.on("open",res); a.on("error",rej); }), 10000, "pas de réponse");
    r("ok", `Joignable (${Math.round(performance.now()-t0)} ms).`);
    try{
      b = new Peer(opts); await timeout(new Promise((res,rej)=>{ b.on("open",res); b.on("error",rej); }), 10000);
      const t1=performance.now();
      await timeout(new Promise((res,rej)=>{
        a.on("connection", c => c.on("data", d => c.send("pong:"+d)));
        const c = b.connect(a.id, {reliable:true});
        c.on("open", () => c.send("ping")); c.on("data", d => d==="pong:ping" ? res() : null); c.on("error", rej);
      }), 15000, "la connexion ne s'ouvre pas");
      r2("ok", `Échange réussi (${Math.round(performance.now()-t1)} ms).${turn?"":" Test fait sur ce seul appareil : testez aussi depuis un téléphone."}`);
    }catch(e){ r2("ko", "Échec : "+e.message+". Le réseau bloque les connexions directes : configurez le relais TURN."); }
  }catch(e){ r("ko", "Injoignable : "+(e.type||e.message)+". Réessayez dans quelques minutes ou changez de réseau."); r2("ko","Non testé."); }
  try{ a&&a.destroy(); b&&b.destroy(); }catch(e){}

  // 7. Écran TV
  r=row("Plein écran et anti-veille");
  const fs = !!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen), wl = "wakeLock" in navigator;
  (fs&&wl) ? r("ok","Plein écran automatique et anti-veille disponibles.") : r("warn", `${fs?"":"Plein écran indisponible (normal sur iPhone). "}${wl?"":"Anti-veille indisponible : désactivez la mise en veille dans les réglages de l'appareil."}`);
  finish();
}
async function relayLoop(servers){
  const cfg={iceServers:servers, iceTransportPolicy:"relay"};
  const p1=new RTCPeerConnection(cfg), p2=new RTCPeerConnection(cfg);
  p1.onicecandidate=e=>e.candidate&&p2.addIceCandidate(e.candidate).catch(()=>{});
  p2.onicecandidate=e=>e.candidate&&p1.addIceCandidate(e.candidate).catch(()=>{});
  const ch=p1.createDataChannel("t");
  const done=new Promise((res)=>{ p2.ondatachannel=e=>{ e.channel.onmessage=m=>{ if(m.data==="relay") res(); }; }; ch.onopen=()=>ch.send("relay"); });
  await p1.setLocalDescription(await p1.createOffer()); await p2.setRemoteDescription(p1.localDescription);
  await p2.setLocalDescription(await p2.createAnswer()); await p1.setRemoteDescription(p2.localDescription);
  try{ await done; } finally { p1.close(); p2.close(); }
}
function finish(){
  const ko=results.includes("ko"), warn=results.includes("warn");
  sum.className="sum "+(ko?"ko":warn?"warn":"ok");
  sum.textContent = ko ? "❌ Un problème empêche le jeu de fonctionner correctement ici. Voir les lignes en rouge." : warn ? "⚠️ Le jeu fonctionne, avec des points à améliorer (lignes orange)." : "✅ Tout est prêt sur cet appareil.";
}
document.getElementById("again").onclick = run;
run();
</script>
</body>
</html>
